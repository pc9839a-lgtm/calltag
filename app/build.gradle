android {
    namespace 'kr.pagero.calltag'
    compileSdk 36

    defaultConfig {
        applicationId 'kr.pagero.calltag'
        minSdk 26
        targetSdk 36
        versionCode 84
        versionName '0.44.6'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        buildConfigField 'String', 'FIREBASE_APPLICATION_ID', '"' + envString('CALLTAG_FIREBASE_APPLICATION_ID') + '"'
        buildConfigField 'String', 'FIREBASE_API_KEY', '"' + envString('CALLTAG_FIREBASE_API_KEY') + '"'
        buildConfigField 'String', 'FIREBASE_PROJECT_ID', '"' + envString('CALLTAG_FIREBASE_PROJECT_ID') + '"'
        buildConfigField 'String', 'FIREBASE_SENDER_ID', '"' + envString('CALLTAG_FIREBASE_SENDER_ID') + '"'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            def storePath = System.getenv('CALLTAG_KEYSTORE_PATH') ?: ''
            if (!storePath.isEmpty()) {
                storeFile file(storePath)
                storePassword System.getenv('CALLTAG_KEYSTORE_PASSWORD') ?: ''
                keyAlias System.getenv('CALLTAG_KEY_ALIAS') ?: ''
                keyPassword System.getenv('CALLTAG_KEY_PASSWORD') ?: ''
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (!((System.getenv('CALLTAG_KEYSTORE_PATH') ?: '').isEmpty())) {
                signingConfig signingConfigs.release
            }
        }
    }
}

def envString(String name) {
    def value = System.getenv(name)
    return value == null ? '' : value.replace('\\', '\\\\').replace('"', '\\"')
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'androidx.work:work-runtime:2.10.5'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.google.firebase:firebase-messaging:25.0.1'
    implementation 'com.android.billingclient:billing:9.1.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
