<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet" />
  <title>콜태그 관리자</title>
  <link rel="stylesheet" href="/admin/admin.css?v=20260812-1" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><strong>콜태그 관리자</strong><span>READ ONLY</span></div>
    <div class="actions"><span id="adminIdentity"></span><button id="refreshButton" type="button">새로고침</button></div>
  </header>
  <div id="statusBar" class="statusbar">운영 데이터 연결 확인 중</div>
  <main class="wrap">
    <section class="metrics">
      <article><span>전체 회원</span><strong id="metricTotal">—</strong></article>
      <article><span>7일 신규</span><strong id="metricNew">—</strong></article>
      <article><span>체험 중</span><strong id="metricTrial">—</strong></article>
      <article><span>유료 활성</span><strong id="metricPaid">—</strong></article>
      <article><span>결제 확인 필요</span><strong id="metricPaymentReview">—</strong></article>
      <article><span>파트너 적립 대기</span><strong id="metricPartner">—</strong></article>
    </section>
    <section class="panel">
      <div class="panelhead"><div><h1>최근 회원</h1><p id="generatedAt">민감정보는 서버에서 마스킹 후 표시</p></div></div>
      <div class="tablewrap">
        <table>
          <thead><tr><th>회원 ID</th><th>이메일</th><th>전화번호</th><th>가입일</th><th>이용권</th><th>상태</th><th>검증</th><th></th></tr></thead>
          <tbody id="memberRows"></tbody>
        </table>
      </div>
      <div id="emptyMembers" class="empty">운영 데이터 접근이 잠겨 있습니다.</div>
    </section>
  </main>
  <div id="detailBackdrop" class="backdrop" hidden></div>
  <aside id="memberDetail" class="drawer" hidden>
    <div class="drawerhead"><div><strong>회원 상세</strong><small id="detailOwnerId"></small></div><button id="detailClose" type="button" aria-label="닫기">×</button></div>
    <div id="detailBody" class="drawerbody"></div>
  </aside>
  <script src="/admin/admin.js?v=20260812-1" defer></script>
</body>
</html>
