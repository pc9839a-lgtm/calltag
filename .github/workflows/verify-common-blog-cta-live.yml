name: Verify common blog CTA live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-common-blog-cta-live.yml'

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Poll production pages
        shell: bash
        run: |
          set -euo pipefail
          URLS=(
            'https://calltag.pagero.kr/guide/real-estate-customer-management/'
            'https://calltag.pagero.kr/guide/insurance-agent-customer-management/'
            'https://calltag.pagero.kr/guide/customer-management-app/'
          )
          for i in $(seq 1 24); do
            OK=1
            for URL in "${URLS[@]}"; do
              HTML="$(curl -fsSL --max-time 15 "$URL" || true)"
              printf '%s' "$HTML" | grep -Fq '콜태그 무료로 시작' || OK=0
              printf '%s' "$HTML" | grep -Fq 'href="https://calltag.pagero.kr/">무료로 시작</a>' || OK=0
              if printf '%s' "$HTML" | grep -Fq '부동산 고객관리, 무료로 시작'; then OK=0; fi
            done
            if [ "$OK" -eq 1 ]; then
              echo "LIVE_OK attempt=$i"
              exit 0
            fi
            echo "waiting attempt=$i"
            sleep 10
          done
          echo "LIVE_NOT_UPDATED"
          exit 1
