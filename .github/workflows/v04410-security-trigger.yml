name: TEMP trigger CallTag code88 security patch

on:
  push:
    branches:
      - agent/calltag-v04410-security-hardening

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/calltag-v04410-security-hardening
          fetch-depth: 0
      - name: Apply staged security patch
        run: python3 scripts/security_patch_code88.py
      - name: Commit and push hardened source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'openai-agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Harden Android security boundaries for code88'
          git push origin HEAD:agent/calltag-v04410-security-hardening
