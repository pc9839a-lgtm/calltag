name: Apply residual CallTag 0.44.9 UI patch

on:
  pull_request:
    branches:
      - agent/play-internal-v0430-run2

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/calltag-v0449-dialog-small-screen'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/calltag-v0449-dialog-small-screen
          fetch-depth: 0
      - name: Apply residual source patch
        run: python .github/scripts/apply_v0449_residuals.py
      - name: Commit app source only
        shell: bash
        run: |
          git config user.name "calltag-patch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app
          git commit -m "Remove residual OEM pickers and spinner UI"
          git push origin HEAD:agent/calltag-v0449-dialog-small-screen
