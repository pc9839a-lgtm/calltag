name: CallTag Firebase Analytics preparation QA

on:
  pull_request:
    branches:
      - agent/calltag-v04456-referral-abuse-postcall-hotfix
    paths:
      - 'app/**'
      - 'build.gradle'
      - '.gitignore'
      - 'scripts/calltag-firebase-analytics-qa.mjs'
      - '.github/workflows/calltag-firebase-analytics-qa.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate Analytics behavior and privacy guards
        run: node scripts/calltag-firebase-analytics-qa.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile existing Android debug app without Firebase JSON
        run: gradle :app:assembleDebug --no-daemon --stacktrace
