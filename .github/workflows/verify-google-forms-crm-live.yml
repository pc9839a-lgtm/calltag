name: Verify Google Forms CRM guide live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-google-forms-crm-live.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Poll production
        shell: bash
        run: |
          set -euo pipefail
          URL='https://calltag.pagero.kr/guide/google-forms-customer-management/'
          HUB='https://calltag.pagero.kr/guide/'
          for i in $(seq 1 24); do
            HTML="$(curl -fsSL --max-time 15 "$URL" || true)"
            HUBHTML="$(curl -fsSL --max-time 15 "$HUB" || true)"
            OK=1
            printf '%s' "$HTML" | grep -Fq '<title>Google Forms CRM 연동: 구글폼 응답을 고객관리로 연결하는 법 | 콜태그</title>' || OK=0
            printf '%s' "$HTML" | grep -Fq '연동 전에 중복 고객 기준을 먼저 정하세요' || OK=0
            printf '%s' "$HTML" | grep -Fq '콜태그 무료로 시작' || OK=0
            printf '%s' "$HTML" | grep -Fq 'href="https://calltag.pagero.kr/">무료로 시작</a>' || OK=0
            printf '%s' "$HUBHTML" | grep -Fq 'Google Forms CRM 연동, 구글폼 응답을 고객관리로 연결하는 법' || OK=0
            if [ "$OK" -eq 1 ]; then
              echo "LIVE_OK attempt=$i"
              exit 0
            fi
            echo "waiting attempt=$i"
            sleep 10
          done
          echo "LIVE_NOT_UPDATED"
          exit 1
