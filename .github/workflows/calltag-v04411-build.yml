name: CallTag 0.44.15 code2026090801 signed update

on:
  workflow_dispatch:
  push:
    branches:
      - agent/calltag-v04411-auto-popup-exclusion-play-aab
  pull_request:
    branches:
      - agent/calltag-v04410-play-aab

permissions:
  contents: read
  actions: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'versionCode 2026090801' app/build.gradle
          grep -F "versionName '0.44.15'" app/build.gradle
          grep -F "applicationId 'kr.pagero.calltag'" app/build.gradle
          grep -F 'minSdk 26' app/build.gradle
          grep -F 'targetSdk 36' app/build.gradle
          grep -F 'MODE_BACKGROUND_ACTIVITY_START_ALLOW_ALWAYS' app/src/main/java/kr/pagero/calltag/PostCallActivityLauncher.java
          grep -F 'PostCallExclusionStore.contains' app/src/main/java/kr/pagero/calltag/PostCallActivityLauncher.java
          grep -F 'postCallExclude' app/src/main/res/layout/activity_post_call.xml
          grep -F '"통화 후 팝업 제외"' app/src/main/java/kr/pagero/calltag/MoreSettingsHubView.java
          grep -F 'PostCallExclusionActivity' app/src/main/AndroidManifest.xml
          grep -F '#343940' app/src/main/res/drawable/bg_secondary_button.xml
          grep -F 'bg_primary_button_soft' app/src/main/res/layout/activity_post_call.xml
          grep -F 'bg_blue_outline_button' app/src/main/res/layout/activity_post_call.xml
          grep -F 'R.color.primary_muted' app/src/main/java/kr/pagero/calltag/PostCallExclusionActivity.java
          if grep -F 'R.color.danger' app/src/main/java/kr/pagero/calltag/PostCallExclusionActivity.java; then
            echo '::error::New popup-exclusion buttons must not use red danger styling.'
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android 16 regression tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --stacktrace

      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calltag-v0.44.15-code2026090801-instrumentation-results
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: ignore

      - name: Resolve Play upload credentials
        env:
          SECRET_UPLOAD_KEYSTORE_BASE64: ${{ secrets.CALLTAG_UPLOAD_KEYSTORE_BASE64 }}
          SECRET_UPLOAD_CREDENTIALS: ${{ secrets.CALLTAG_UPLOAD_CREDENTIALS }}
          SECRET_UPLOAD_STORE_PASSWORD: ${{ secrets.CALLTAG_UPLOAD_STORE_PASSWORD }}
          SECRET_UPLOAD_KEY_ALIAS: ${{ secrets.CALLTAG_UPLOAD_KEY_ALIAS }}
          SECRET_UPLOAD_KEY_PASSWORD: ${{ secrets.CALLTAG_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          import sys

          raw = (os.environ.get('SECRET_UPLOAD_CREDENTIALS') or '').strip()
          values = {}

          if raw:
              try:
                  parsed = json.loads(raw)
                  if isinstance(parsed, dict):
                      values.update({str(k): str(v) for k, v in parsed.items() if v is not None})
              except json.JSONDecodeError:
                  for line in raw.splitlines():
                      line = line.strip()
                      if not line or line.startswith('#') or '=' not in line:
                          continue
                      key, value = line.split('=', 1)
                      values[key.strip()] = value.strip().strip('"').strip("'")

          legacy = {
              'CALLTAG_UPLOAD_STORE_PASSWORD': os.environ.get('SECRET_UPLOAD_STORE_PASSWORD', ''),
              'CALLTAG_UPLOAD_KEY_ALIAS': os.environ.get('SECRET_UPLOAD_KEY_ALIAS', ''),
              'CALLTAG_UPLOAD_KEY_PASSWORD': os.environ.get('SECRET_UPLOAD_KEY_PASSWORD', ''),
          }
          for key, value in legacy.items():
              if value:
                  values.setdefault(key, value)

          aliases = {
              'CALLTAG_UPLOAD_STORE_PASSWORD': (
                  'CALLTAG_UPLOAD_STORE_PASSWORD', 'STORE_PASSWORD', 'storePassword', 'store_password',
                  'KEYSTORE_PASSWORD', 'keystorePassword', 'keystore_password'),
              'CALLTAG_UPLOAD_KEY_ALIAS': (
                  'CALLTAG_UPLOAD_KEY_ALIAS', 'KEY_ALIAS', 'keyAlias', 'key_alias', 'ALIAS'),
              'CALLTAG_UPLOAD_KEY_PASSWORD': (
                  'CALLTAG_UPLOAD_KEY_PASSWORD', 'KEY_PASSWORD', 'keyPassword', 'key_password'),
          }

          resolved = {}
          for target, candidates in aliases.items():
              for candidate in candidates:
                  value = values.get(candidate, '')
                  if value:
                      resolved[target] = value
                      break

          missing = [key for key in aliases if not resolved.get(key)]
          if not os.environ.get('SECRET_UPLOAD_KEYSTORE_BASE64', '').strip():
              missing.append('CALLTAG_UPLOAD_KEYSTORE_BASE64')
          if missing:
              print('::error::Stable Play upload signing is not fully configured: ' + ', '.join(missing))
              sys.exit(1)

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              for key, value in resolved.items():
                  env.write(f'{key}={value}\n')
          PY

      - name: Restore verified Play upload key
        env:
          SECRET_UPLOAD_KEYSTORE_BASE64: ${{ secrets.CALLTAG_UPLOAD_KEYSTORE_BASE64 }}
          EXPECTED_UPLOAD_KEY_SHA256: 'C3:4C:98:88:9B:0C:88:8A:BB:39:94:6C:80:16:96:C2:89:E2:82:6C:10:0F:41:7A:0B:CE:25:A3:92:C4:72:A7'
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/calltag-upload.jks"
          printf '%s' "$SECRET_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          echo "::add-mask::$CALLTAG_UPLOAD_STORE_PASSWORD"
          echo "::add-mask::$CALLTAG_UPLOAD_KEY_PASSWORD"
          chmod 600 "$KEYSTORE"
          keytool -list -v -keystore "$KEYSTORE" -storepass "$CALLTAG_UPLOAD_STORE_PASSWORD" -alias "$CALLTAG_UPLOAD_KEY_ALIAS" \
            | grep -E 'Alias name:|Owner:|SHA1:|SHA256:' > "$RUNNER_TEMP/upload-key-fingerprints.txt"
          grep -F "SHA256: $EXPECTED_UPLOAD_KEY_SHA256" "$RUNNER_TEMP/upload-key-fingerprints.txt"
          {
            echo "CALLTAG_UPLOAD_KEYSTORE_PATH=$KEYSTORE"
            echo "CALLTAG_EXPECTED_UPLOAD_KEY_SHA256=$EXPECTED_UPLOAD_KEY_SHA256"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK and Play AAB
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Verify and stage signed artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          AAB='app/build/outputs/bundle/release/app-release.aab'
          test -s "$APK"
          test -s "$AAB"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          APK_VERIFY="$RUNNER_TEMP/apk-verify.txt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$APK_VERIFY"
          EXPECTED_APK_CERT="$(printf '%s' "$CALLTAG_EXPECTED_UPLOAD_KEY_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          ACTUAL_APK_CERT="$(grep -i 'certificate SHA-256 digest:' "$APK_VERIFY" | head -n 1 | sed 's/.*digest: //' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_APK_CERT" = "$EXPECTED_APK_CERT"
          jarsigner -verify -certs "$AAB"
          keytool -printcert -jarfile "$AAB" > "$RUNNER_TEMP/aab-cert.txt"
          grep -F "SHA256: $CALLTAG_EXPECTED_UPLOAD_KEY_SHA256" "$RUNNER_TEMP/aab-cert.txt"
          OUT="$RUNNER_TEMP/calltag-v0.44.15-code2026090801-release"
          mkdir -p "$OUT"
          cp "$APK" "$OUT/CallTag-v0.44.15-code2026090801-release.apk"
          cp "$AAB" "$OUT/CallTag-v0.44.15-code2026090801.aab"
          sha256sum "$APK" > "$OUT/CALLTAG_V04415_APK_SHA256.txt"
          sha256sum "$AAB" > "$OUT/CALLTAG_V04415_AAB_SHA256.txt"
          cp "$RUNNER_TEMP/upload-key-fingerprints.txt" "$OUT/CALLTAG_UPLOAD_KEY_FINGERPRINTS.txt"
          cp "$RUNNER_TEMP/apk-verify.txt" "$OUT/CALLTAG_V04415_APK_SIGNATURE_VERIFY.txt"
          cp "$RUNNER_TEMP/aab-cert.txt" "$OUT/CALLTAG_V04415_AAB_CERTIFICATE.txt"

      - name: Upload signed update artifacts
        uses: actions/upload-artifact@v4
        with:
          name: calltag-v0.44.15-code2026090801-signed-update
          path: ${{ runner.temp }}/calltag-v0.44.15-code2026090801-release
          retention-days: 90
          if-no-files-found: error
