name: CallTag Partner Admin QA

on:
  pull_request:
    paths:
      - 'admin/**'
      - 'worker/admin.js'
      - 'worker/partner.js'
      - 'web/settlement.html'
      - 'web/settlement.js'
      - 'web/settlement-security.js'
      - '.github/workflows/calltag-partner-admin-qa.yml'
  push:
    branches:
      - 'main'
      - 'agent/calltag-admin-partner-settlement'
    paths:
      - 'admin/**'
      - 'worker/admin.js'
      - 'worker/partner.js'
      - 'web/settlement.html'
      - 'web/settlement.js'
      - 'web/settlement-security.js'
      - '.github/workflows/calltag-partner-admin-qa.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Parse scripts
        run: |
          set -euo pipefail
          node --check worker/admin.js
          node --check worker/partner.js
          node --check admin/admin.js
          node --check web/settlement.js
          node --check web/settlement-security.js
      - name: Enforce gateway contract
        run: |
          set -euo pipefail
          grep -q "/api/call/admin/partners" worker/admin.js
          grep -q "/api/call/admin/partner-rate" worker/admin.js
          grep -q "/api/call/admin/settlement-pay" worker/admin.js
          grep -q "partner.rate.update" worker/admin.js
          grep -q "partner.settlement.pay" worker/admin.js
          grep -q "파트너·정산" admin/shell.dat
          grep -q "정산 지급" admin/admin.js
          grep -q "이용 상태" admin/shell.dat
          grep -q "결제 검증" admin/shell.dat
          grep -q "paymentVerificationLabel" admin/admin.js
          grep -q "settlement-security.js" web/settlement.html
          grep -q "/api/partner/login" web/settlement-security.js
          grep -q "/api/partner/dashboard" web/settlement.js
          grep -q "/api/partner/referrals" web/settlement.js
          grep -q "/api/partner/earnings" web/settlement.js
          grep -q "/api/partner/settlements" web/settlement.js
          grep -q "inlet-8mr.pages.dev" worker/partner.js
          if grep -E -n 'purchaseToken|purchase_token|order_id|payment_reference|external_subscription_id' web/settlement.js web/settlement-security.js; then
            echo 'Sensitive billing field found in partner settlement surface.' >&2
            exit 1
          fi
          if grep -E -n 'localStorage|sessionStorage|purchaseToken|purchase_token|order_id|payment_reference|external_subscription_id|password' worker/admin.js admin/admin.js admin/shell.dat; then
            echo 'Reusable credential or sensitive billing field found in web admin surface.' >&2
            exit 1
          fi
