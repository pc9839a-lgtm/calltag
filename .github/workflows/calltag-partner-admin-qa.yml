name: CallTag Partner Admin QA

on:
  pull_request:
    paths:
      - '_worker.js'
      - '_worker-core.js'
      - 'admin/**'
      - 'worker/admin.js'
      - 'worker/admin-payout-bridge.js'
      - 'worker/admin-ops-bridge.js'
      - 'worker/partner.js'
      - 'web/settlement.html'
      - 'web/settlement.js'
      - 'web/settlement-core.js'
      - 'web/settlement-security.js'
      - 'web/settlement-finalize.js'
      - 'web/settlement-finalize.css'
      - 'web/settlement-polish.js'
      - 'web/settlement-polish.css'
      - '.github/workflows/calltag-partner-admin-qa.yml'
  push:
    branches:
      - 'main'
      - 'agent/calltag-admin-partner-settlement'
    paths:
      - '_worker.js'
      - '_worker-core.js'
      - 'admin/**'
      - 'worker/admin.js'
      - 'worker/admin-payout-bridge.js'
      - 'worker/admin-ops-bridge.js'
      - 'worker/partner.js'
      - 'web/settlement.html'
      - 'web/settlement.js'
      - 'web/settlement-core.js'
      - 'web/settlement-security.js'
      - 'web/settlement-finalize.js'
      - 'web/settlement-finalize.css'
      - 'web/settlement-polish.js'
      - 'web/settlement-polish.css'
      - '.github/workflows/calltag-partner-admin-qa.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Parse scripts
        run: |
          set -euo pipefail
          node --check _worker.js
          node --check _worker-core.js
          node --check worker/admin.js
          node --check worker/admin-payout-bridge.js
          node --check worker/admin-ops-bridge.js
          node --check worker/partner.js
          node --check admin/admin.js
          node --check admin/payout-request.js
          node --check admin/play-finance.js
          node --check admin/play-finance-monthly.js
          node --check admin/member-ops.js
          node --check web/settlement.js
          node --check web/settlement-core.js
          node --check web/settlement-security.js
          node --check web/settlement-finalize.js
          node --check web/settlement-polish.js
      - name: Enforce gateway contract
        run: |
          set -euo pipefail
          grep -q "/api/call/admin/partners" worker/admin.js
          grep -q "/api/call/admin/partner-rate" worker/admin.js
          grep -q "/api/call/admin/settlement-pay" worker/admin.js
          grep -q "/api/call/admin/play-finance" worker/admin.js
          grep -q "partner.rate.update" worker/admin.js
          grep -q "partner.settlement.pay" worker/admin.js
          grep -q "handleAdminPayoutBridge" _worker.js
          grep -q "handleAdminOpsBridge" _worker.js
          grep -q "/api/call/admin/partners" worker/admin-payout-bridge.js
          grep -q "/api/call/admin/partner" worker/admin-payout-bridge.js
          grep -q "/api/call/admin/settlement-pay" worker/admin-payout-bridge.js
          grep -q "requestId" worker/admin-payout-bridge.js
          grep -q "payoutRequestCount" worker/admin-payout-bridge.js
          grep -q "accountNumberMasked" worker/admin-payout-bridge.js
          grep -q "/api/call/admin/members" worker/admin-ops-bridge.js
          grep -q "/api/call/admin/member-payments" worker/admin-ops-bridge.js
          grep -q "/api/call/admin/play-finance-monthly" worker/admin-ops-bridge.js
          grep -q "파트너·정산" admin/shell.dat
          grep -q "지급요청" admin/shell.dat
          grep -q "partnerRequested" admin/shell.dat
          grep -q "payout-request.js" admin/shell.dat
          grep -q "Google Play 확정 정산" admin/shell.dat
          grep -q "play-finance-monthly.js" admin/shell.dat
          grep -q "member-ops.js" admin/shell.dat
          grep -q "memberSearchInput" admin/shell.dat
          grep -q "정산 지급" admin/admin.js
          grep -q "지급완료" admin/payout-request.js
          grep -q "requestId" admin/payout-request.js
          grep -q "accountNumberMasked" admin/payout-request.js
          grep -q "/admin/api/settlement-pay" admin/payout-request.js
          grep -q "이용 상태" admin/shell.dat
          grep -q "결제 검증" admin/shell.dat
          grep -q "paymentVerificationLabel" admin/admin.js
          grep -q "memberSubscriptions" admin/admin.js
          grep -q "/admin/api/play-finance-monthly" admin/play-finance-monthly.js
          grep -q "/admin/api/members" admin/member-ops.js
          grep -q "/admin/api/member-payments" admin/member-ops.js
          grep -q "settlement-security.js" web/settlement.html
          grep -q "/api/partner/login" web/settlement-security.js
          grep -q "settlement-core.js" web/settlement.js
          grep -q "settlement-finalize.js" _worker.js
          grep -q "settlement-polish.css" _worker.js
          grep -q "settlement-polish.js" _worker.js
          grep -q "/api/partner/totp/fresh" web/settlement-finalize.js
          grep -q "/api/partner/logout" web/settlement-finalize.js
          grep -q "settlementMobileFlow" web/settlement-polish.js
          grep -q "payoutProfileSummary" web/settlement-polish.js
          grep -q "추천코드 복사" web/settlement-polish.js
          grep -q "/api/partner/dashboard" web/settlement-core.js
          grep -q "/api/partner/referrals" web/settlement-core.js
          grep -q "/api/partner/earnings" web/settlement-core.js
          grep -q "/api/partner/settlements" web/settlement-core.js
          grep -q "inlet-8mr.pages.dev" worker/partner.js
          grep -q "Google Authenticator 등록" web/settlement-security.js
          grep -q "QR 코드 스캔" web/settlement-security.js
          grep -q "QR을 사용할 수 없나요? 직접 입력하기" web/settlement-security.js
          grep -q "qrcodejs/1.0.0/qrcode.min.js" web/settlement-security.js
          grep -q "sha512-CNgIRecGo7nphbeZ04Sc13ka07paqdeTu0WR1IM4kNcpmBAUSHSQX0FslNhTDadL4O5SAGapGt4FodqL8My0mA==" web/settlement-security.js
          if grep -E -n 'api\.qrserver\.com|quickchart\.io|chart\.googleapis\.com' web/settlement-security.js; then
            echo 'TOTP secret must not be sent to an external QR rendering API.' >&2
            exit 1
          fi
          if grep -E -n 'purchaseToken|purchase_token|order_id|payment_reference|external_subscription_id' web/settlement-core.js web/settlement-security.js web/settlement-finalize.js web/settlement-polish.js admin/play-finance.js admin/play-finance-monthly.js admin/member-ops.js admin/payout-request.js worker/admin-payout-bridge.js worker/admin-ops-bridge.js; then
            echo 'Sensitive billing field found in admin or partner settlement surface.' >&2
            exit 1
          fi
          if grep -E -n 'account_number_ciphertext|account_number_iv|business_number_ciphertext|business_number_iv' worker/admin-payout-bridge.js admin/payout-request.js web/settlement-polish.js; then
            echo 'Encrypted payout storage fields must not cross the browser/admin gateway.' >&2
            exit 1
          fi
          if grep -E -n 'localStorage|sessionStorage|purchaseToken|purchase_token|order_id|payment_reference|external_subscription_id|password' worker/admin.js worker/admin-payout-bridge.js worker/admin-ops-bridge.js admin/admin.js admin/payout-request.js admin/play-finance.js admin/play-finance-monthly.js admin/member-ops.js admin/shell.dat; then
            echo 'Reusable credential or sensitive billing field found in web admin surface.' >&2
            exit 1
          fi
