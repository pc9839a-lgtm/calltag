name: Verify car sales guide live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-car-sales-guide-live.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Poll production
        shell: bash
        run: |
          set -euo pipefail
          URL='https://calltag.pagero.kr/guide/car-sales-customer-management/'
          for i in $(seq 1 24); do
            HTML="$(curl -fsSL --max-time 15 "$URL" || true)"
            OK=1
            printf '%s' "$HTML" | grep -Fq '<title>자동차 딜러 CRM: 시승·견적·출고·재구매 고객관리 | 콜태그</title>' || OK=0
            printf '%s' "$HTML" | grep -Fq '견적부터 출고 후까지' || OK=0
            printf '%s' "$HTML" | grep -Fq '콜태그 무료로 시작' || OK=0
            printf '%s' "$HTML" | grep -Fq 'href="https://calltag.pagero.kr/">무료로 시작</a>' || OK=0
            if [ "$OK" -eq 1 ]; then
              echo "LIVE_OK attempt=$i"
              exit 0
            fi
            echo "waiting attempt=$i"
            sleep 10
          done
          echo "LIVE_NOT_UPDATED"
          exit 1
