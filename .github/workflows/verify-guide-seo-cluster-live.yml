name: Verify guide SEO cluster live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-guide-seo-cluster-live.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Audit live guide cluster
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, time, urllib.request
          base='https://calltag.pagero.kr'
          paths=[
            '/guide/',
            '/guide/customer-management-app/',
            '/guide/after-call-customer-management/',
            '/guide/phone-consultation-record/',
            '/guide/follow-up-schedule-management/',
            '/guide/sales-customer-management/',
            '/guide/insurance-agent-customer-management/',
            '/guide/real-estate-customer-management/',
            '/guide/car-sales-customer-management/',
            '/guide/academy-consultation-customer-management/',
            '/guide/interior-consultation-customer-management/',
            '/guide/meta-lead-ads-customer-management/',
            '/guide/google-forms-customer-management/',
            '/guide/pagero-inquiry-customer-management/',
            '/guide/webhook-customer-inquiry-integration/',
            '/guide/external-inquiry-integration/',
          ]
          expected={base+p for p in paths}
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'CallTagSEOAudit/1.0'})
            with urllib.request.urlopen(req,timeout=15) as r:
              return r.status,r.read().decode('utf-8','replace')
          last=[]
          for attempt in range(1,25):
            errors=[]; titles={}
            for p in paths:
              url=base+p
              try:
                status,html=get(url)
              except Exception as e:
                errors.append(f'{p}: fetch {e}'); continue
              if status!=200: errors.append(f'{p}: HTTP {status}')
              ts=re.findall(r'<title>(.*?)</title>',html,re.I|re.S)
              if len(ts)!=1: errors.append(f'{p}: title count {len(ts)}')
              elif ts[0] in titles: errors.append(f'{p}: duplicate title with {titles[ts[0]]}')
              else: titles[ts[0]]=p
              cs=re.findall(r'<link\s+rel=["\']canonical["\']\s+href=["\']([^"\']+)["\']',html,re.I)
              if cs!=[url]: errors.append(f'{p}: canonical {cs}')
              if p!='/guide/' and 'href="https://calltag.pagero.kr/">무료로 시작</a>' not in html:
                errors.append(f'{p}: common CTA missing')
            try:
              _,hub=get(base+'/guide/')
              hrefs=set(re.findall(r'href="(/guide/[^"]+)"',hub))
              missing={p for p in paths[1:] if p not in hrefs}
              if missing: errors.append('hub missing links: '+','.join(sorted(missing)))
              for phrase in [
                '자동차 딜러 CRM, 시승·견적·출고·재구매 고객관리',
                '학원 고객관리 프로그램, 상담 CRM과 출결·수납 학원관리 비교',
                '인테리어 고객관리 프로그램, 상담·견적 CRM과 공사관리 ERP 비교'
              ]:
                if phrase not in hub: errors.append('hub anchor missing: '+phrase)
            except Exception as e: errors.append('hub fetch '+str(e))
            for leaf in [
              '/guide/meta-lead-ads-customer-management/',
              '/guide/google-forms-customer-management/',
              '/guide/pagero-inquiry-customer-management/',
              '/guide/webhook-customer-inquiry-integration/'
            ]:
              try:
                _,html=get(base+leaf)
                if '/guide/external-inquiry-integration/' not in html:
                  errors.append(leaf+': cluster hub backlink missing')
              except Exception as e: errors.append(leaf+': '+str(e))
            try:
              _,sm=get(base+'/sitemap.xml')
              for p in paths:
                if base+p not in sm: errors.append('sitemap missing '+p)
            except Exception as e: errors.append('sitemap '+str(e))
            if not errors:
              print('LIVE_OK attempt=',attempt,'pages=',len(paths))
              raise SystemExit(0)
            last=errors
            print('waiting',attempt,'errors',len(errors))
            time.sleep(10)
          print('\n'.join(last))
          raise SystemExit(1)
          PY
