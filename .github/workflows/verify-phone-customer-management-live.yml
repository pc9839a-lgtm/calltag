name: Verify phone customer management guide live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-phone-customer-management-live.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Poll production
        shell: bash
        run: |
          set -euo pipefail
          URL='https://calltag.pagero.kr/guide/after-call-customer-management/'
          HUB='https://calltag.pagero.kr/guide/'
          MAP='https://calltag.pagero.kr/sitemap.xml'
          for i in $(seq 1 24); do
            HTML="$(curl -fsSL --max-time 15 "$URL" || true)"
            HUBHTML="$(curl -fsSL --max-time 15 "$HUB" || true)"
            SITEMAP="$(curl -fsSL --max-time 15 "$MAP" || true)"
            OK=1
            printf '%s' "$HTML" | grep -Fq '<title>전화 고객관리 앱: 통화후 메모·콜백문자·재연락 비교 | 콜태그</title>' || OK=0
            printf '%s' "$HTML" | grep -Fq '콜백문자와 전화 고객관리는 목적부터 다릅니다' || OK=0
            printf '%s' "$HTML" | grep -Fq '콜태그 무료로 시작' || OK=0
            printf '%s' "$HTML" | grep -Fq 'href="https://calltag.pagero.kr/">무료로 시작</a>' || OK=0
            printf '%s' "$HUBHTML" | grep -Fq '전화 고객관리 앱, 통화후 메모·콜백문자·재연락 비교' || OK=0
            printf '%s' "$SITEMAP" | grep -A1 -F '<loc>https://calltag.pagero.kr/guide/after-call-customer-management/</loc>' | grep -Fq '<lastmod>2026-10-05</lastmod>' || OK=0
            if [ "$OK" -eq 1 ]; then
              echo "LIVE_OK attempt=$i"
              exit 0
            fi
            echo "waiting attempt=$i"
            sleep 10
          done
          echo "LIVE_NOT_UPDATED"
          exit 1
