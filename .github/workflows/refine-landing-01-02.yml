name: Refine CallTag landing sections 01-02

on:
  push:
    branches:
      - feat/landing-rebuild-sections-01-02-20260916
    paths:
      - '.github/workflows/refine-landing-01-02.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/landing-rebuild-sections-01-02-20260916
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply concise tone patch
        run: python scripts/refine_landing_sections_01_02.py
      - name: Validate concise landing contract
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          required=['전화가 끝난 뒤,','고객관리는 시작됩니다.','고객 · 상담 · 다음 할 일. 통화 직후 바로 남기세요.','기억 말고, <strong>콜태그에 남기세요.</strong>','7일 무료로 시작하기']
          banned=['hero-preview reveal','아까 그 고객,','견적 보내준다고 했는데','3일 무료체험','+7일']
          for x in required:
              assert x in s, x
          for x in banned:
              assert x not in s, x
          print('landing concise contract PASS')
          PY
      - name: Commit refined landing
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(landing): restore concise original visual tone'
          git push origin HEAD:feat/landing-rebuild-sections-01-02-20260916
