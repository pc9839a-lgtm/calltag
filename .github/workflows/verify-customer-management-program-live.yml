name: Verify customer management program guide live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-customer-management-program-live.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Poll production
        shell: bash
        run: |
          set -euo pipefail
          URL='https://calltag.pagero.kr/guide/customer-management-app/'
          HUB='https://calltag.pagero.kr/guide/'
          MAP='https://calltag.pagero.kr/sitemap.xml'
          for i in $(seq 1 24); do
            HTML="$(curl -fsSL --max-time 15 "$URL" || true)"
            HUBHTML="$(curl -fsSL --max-time 15 "$HUB" || true)"
            SITEMAP="$(curl -fsSL --max-time 15 "$MAP" || true)"
            OK=1
            printf '%s' "$HTML" | grep -Fq '<title>고객관리 프로그램·앱 고르는 법: 엑셀 vs 1인 CRM vs 팀 CRM | 콜태그</title>' || OK=0
            printf '%s' "$HTML" | grep -Fq '엑셀·1인 CRM·팀 CRM·업종 전용 프로그램을 이렇게 나누세요' || OK=0
            printf '%s' "$HTML" | grep -Fq '콜태그 무료로 시작' || OK=0
            printf '%s' "$HTML" | grep -Fq 'href="https://calltag.pagero.kr/">무료로 시작</a>' || OK=0
            printf '%s' "$HUBHTML" | grep -Fq '고객관리 프로그램·앱 고르는 법, 엑셀 vs 1인 CRM vs 팀 CRM' || OK=0
            printf '%s' "$SITEMAP" | grep -A1 -F '<loc>https://calltag.pagero.kr/guide/customer-management-app/</loc>' | grep -Fq '<lastmod>2026-10-04</lastmod>' || OK=0
            if [ "$OK" -eq 1 ]; then
              echo "LIVE_OK attempt=$i"
              exit 0
            fi
            echo "waiting attempt=$i"
            sleep 10
          done
          echo "LIVE_NOT_UPDATED"
          exit 1
