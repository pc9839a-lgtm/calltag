name: Fix CallTag live spacing v4

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-live-spacing-v4.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Force visible section spacing and refine animation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          asset = Path('assets/calltag-landing-live-0102-v1.js')
          text = asset.read_text(encoding='utf-8')

          replacements = {
              "document.documentElement.dataset.ctLanding0102V3": "document.documentElement.dataset.ctLanding0102V4",
              "document.documentElement.dataset.ctLanding0102V3='1'": "document.documentElement.dataset.ctLanding0102V4='1'",
              "#app.hero-app{padding-bottom:172px!important}": "#app.hero-app{padding-bottom:220px!important}",
              "#ct-live-pain{position:relative;overflow:hidden;padding:184px 0 192px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#0d0f13}": "#ct-live-pain{position:relative;overflow:hidden;padding:230px 0 250px!important;min-height:980px;display:flex!important;align-items:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#0d0f13}",
              "#ct-live-pain .wrap{position:relative;z-index:1}": "#ct-live-pain .wrap{position:relative;z-index:1;width:min(1360px,calc(100% - 96px))}",
              "gap:18px;margin-top:78px": "gap:24px;margin-top:104px",
              "opacity:0;transform:translateY(46px) scale(.975);transition:opacity .68s ease,transform .78s cubic-bezier(.18,.82,.22,1),border-color .32s ease,box-shadow .32s ease,background .32s ease": "opacity:0;transform:translateY(70px) scale(.965);filter:blur(6px);transition:opacity .72s ease,transform .86s cubic-bezier(.18,.82,.22,1),filter .72s ease,border-color .32s ease,box-shadow .32s ease,background .32s ease",
              "#ct-live-pain.is-visible .ct-live-pain-head,#ct-live-pain.is-visible .ct-live-pain-card{opacity:1;transform:none}": "#ct-live-pain.is-visible .ct-live-pain-head,#ct-live-pain.is-visible .ct-live-pain-card{opacity:1;transform:none;filter:none}",
              "#app.hero-app{padding-bottom:118px!important}": "#app.hero-app{padding-bottom:150px!important}",
              "#ct-live-pain{padding:124px 0 132px}": "#ct-live-pain{padding:156px 0 172px!important;min-height:0;display:block!important}",
              "gap:14px;margin-top:56px": "gap:16px;margin-top:72px",
              "#ct-live-pain .ct-live-pain-card{min-height:126px;border-radius:20px}": "#ct-live-pain .ct-live-pain-card{min-height:138px;border-radius:20px}",
              "#ct-live-pain .ct-live-pain-head,#ct-live-pain .ct-live-pain-card{opacity:1!important;transform:none!important;transition:none!important}": "#ct-live-pain .ct-live-pain-head,#ct-live-pain .ct-live-pain-card{opacity:1!important;transform:none!important;filter:none!important;transition:none!important}"
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected source not found: {old[:90]}')
              text = text.replace(old, new, 1)

          asset.write_text(text, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          old = '/assets/calltag-landing-live-0102-v1.js?v=20260916-3'
          new = '/assets/calltag-landing-live-0102-v1.js?v=20260916-4'
          if old not in html:
              raise SystemExit('Expected v3 asset URL not found in index.html')
          html = html.replace(old, new, 1)
          index.write_text(html, encoding='utf-8')
          PY

      - name: Validate patch
        shell: bash
        run: |
          grep -q "padding:230px 0 250px!important" assets/calltag-landing-live-0102-v1.js
          grep -q "min-height:980px" assets/calltag-landing-live-0102-v1.js
          grep -q "v=20260916-4" index.html
          node --check assets/calltag-landing-live-0102-v1.js

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-live-spacing-v4.yml
          git add index.html assets/calltag-landing-live-0102-v1.js
          git commit -m "fix(landing): force generous section spacing"
          git push origin HEAD:main
