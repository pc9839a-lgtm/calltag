name: CallTag 0.44.7 post-call compact regression

on:
  workflow_dispatch:
  push:
    branches:
      - agent/play-internal-v0430-run2
  pull_request:
    branches:
      - agent/play-internal-v0430-run2

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify 0.44.7 contracts
        shell: bash
        run: |
          set -euo pipefail
          assert_absent() {
            local pattern="$1"
            shift
            if grep -R -F -- "$pattern" "$@"; then
              echo "::error::Forbidden pattern found: $pattern"
              exit 1
            fi
          }

          grep -F 'versionCode 85' app/build.gradle
          grep -F "versionName '0.44.7'" app/build.gradle
          grep -F 'targetSdk 36' app/build.gradle

          # Play-safe phone CRM contract remains unchanged.
          grep -F 'android.permission.READ_CALL_LOG' app/src/main/AndroidManifest.xml
          assert_absent 'android.permission.WRITE_CALL_LOG' app/src/main/AndroidManifest.xml
          test ! -e app/src/main/java/kr/pagero/calltag/CallLogMemoSyncManager.java
          assert_absent 'values.put(CallLog.Calls.CACHED_NAME' app/src/main/java
          assert_absent 'CallLogMemoSyncManager' app/src/main/java app/src/androidTest
          assert_absent 'Manifest.permission.WRITE_CALL_LOG' app/src/main/java
          assert_absent 'addIfMissing(missing, Manifest.permission.WRITE_CONTACTS)' app/src/main/java/kr/pagero/calltag/InitialPermissionActivity.java
          assert_absent 'createAppRawContact' app/src/main/java/kr/pagero/calltag/ContactNameSyncManager.java
          assert_absent 'TYPE_KEEP_TOGETHER' app/src/main/java/kr/pagero/calltag/ContactNameSyncManager.java
          assert_absent 'StructuredName.DISPLAY_NAME' app/src/main/java/kr/pagero/calltag/ContactNameSyncManager.java
          grep -F 'android.telecom.CallScreeningService' app/src/main/AndroidManifest.xml
          grep -F 'RoleManager.ROLE_CALL_SCREENING' app/src/main/java/kr/pagero/calltag/CallerIdSetupActivity.java
          grep -F 'CallProcessingLedger' app/src/main/java/kr/pagero/calltag/CallMonitorService.java
          grep -F 'recoverCallsAfterRestart' app/src/main/java/kr/pagero/calltag/CallMonitorService.java
          grep -F 'CallInteractionDeduper.insertOnce' app/src/main/java/kr/pagero/calltag/PostCallActivity.java

          # Signup-only 7 + 7 referral contract remains.
          grep -F 'referralCode' app/src/main/java/kr/pagero/calltag/AuthApiClient.java
          grep -F '통합권 7일 추가, 총 14일 무료' app/src/main/java/kr/pagero/calltag/LoginActivity.java
          grep -F '추천인 코드는 회원가입 시 1회만 입력' app/src/main/java/kr/pagero/calltag/ReferralPartnerActivity.java
          assert_absent '기본 3일' app/src/main/java/kr/pagero/calltag/BillingEntitlementActivity.java
          assert_absent '추천 등록 시 +5일' app/src/main/java/kr/pagero/calltag/BillingEntitlementActivity.java
          grep -F '기본 7일 · 추천인 입력 시 +7일 · 총 14일' app/src/main/java/kr/pagero/calltag/BillingEntitlementActivity.java

          # PageRo connection and service guide remain split.
          grep -F 'PageroConnectionCompactActivity.class' app/src/main/java/kr/pagero/calltag/MoreSettingsHubView.java
          grep -F 'PageroUseGuideActivity.class' app/src/main/java/kr/pagero/calltag/MoreSettingsHubView.java
          assert_absent '이렇게 사용하세요' app/src/main/java/kr/pagero/calltag/PageroConnectionCompactActivity.java
          grep -F 'https://calltag.pagero.kr/web/settlement' app/src/main/java/kr/pagero/calltag/PartnerSettlementActivity.java

          # Home pending-call action remains a real task action.
          grep -F 'HomeTaskEditorActivity.class' app/src/main/java/kr/pagero/calltag/PendingCallSectionView.java
          assert_absent 'PostCallActivity.class' app/src/main/java/kr/pagero/calltag/PendingCallSectionView.java
          grep -F 'actionButton("삭제"' app/src/main/java/kr/pagero/calltag/PendingCallSectionView.java
          grep -F '최근 메모 · ' app/src/main/java/kr/pagero/calltag/PendingCallSectionView.java

          # Post-call is ALWAYS one compact popup. Full-screen notification/activity paths are forbidden.
          assert_absent 'android.permission.USE_FULL_SCREEN_INTENT' app/src/main/AndroidManifest.xml
          assert_absent '.setFullScreenIntent' app/src/main/java
          grep -F 'android:theme="@style/Theme.CallTag.PostCallPopup"' app/src/main/AndroidManifest.xml
          grep -F '<item name="android:windowIsFloating">true</item>' app/src/main/res/values/styles.xml
          grep -F '<item name="android:backgroundDimEnabled">false</item>' app/src/main/res/values/styles.xml
          grep -F 'PostCallPopupWindowInstaller.install(this);' app/src/main/java/kr/pagero/calltag/PostCallActivity.java
          grep -F 'HARD_MAX_SCREEN_HEIGHT_RATIO = 0.55f' app/src/main/java/kr/pagero/calltag/PostCallPopupWindowInstaller.java
          grep -F 'window.clearFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN' app/src/main/java/kr/pagero/calltag/PostCallPopupWindowInstaller.java
          grep -F 'activity_not_visible_notification_only' app/src/main/java/kr/pagero/calltag/PostCallDeliveryGuard.java
          assert_absent 'app.startActivity' app/src/main/java/kr/pagero/calltag/PostCallDeliveryGuard.java

          # Customer Add mirrors raw device CallLog order.
          grep -F 'CallLog.Calls.DATE + " DESC"' app/src/main/java/kr/pagero/calltag/CustomerAddActivity.java
          assert_absent 'seen.contains' app/src/main/java/kr/pagero/calltag/CustomerAddActivity.java
          assert_absent 'if (db.findByPhone(number) != null) continue' app/src/main/java/kr/pagero/calltag/CustomerAddActivity.java

          # Statistics tooltip numbers must be high-contrast and explicit.
          grep -F 'tooltipPaint.setColor(getContext().getColor(R.color.surface_soft))' app/src/main/java/kr/pagero/calltag/StatsTrendChartView.java
          grep -F 'tooltipTextPaint.setColor(getContext().getColor(R.color.text_primary))' app/src/main/java/kr/pagero/calltag/StatsTrendChartView.java
          grep -F '"통화 " + calls[index] + "건  ·  페이지로 " + leads[index] + "명"' app/src/main/java/kr/pagero/calltag/StatsTrendChartView.java

          # Billing and data protection use CallTag dark UI instead of standalone light/system UI.
          assert_absent 'Color.rgb(248, 250, 252)' app/src/main/java/kr/pagero/calltag/BillingEntitlementActivity.java
          assert_absent 'Color.WHITE;' app/src/main/java/kr/pagero/calltag/BillingEntitlementActivity.java
          grep -F 'private static final int BACKGROUND = Color.rgb(16, 17, 19)' app/src/main/java/kr/pagero/calltag/BillingEntitlementActivity.java
          grep -F 'root.setBackgroundColor(getColor(R.color.background))' app/src/main/java/kr/pagero/calltag/CallTagSyncStatusActivity.java
          grep -F 'actionButton("지금 동기화"' app/src/main/java/kr/pagero/calltag/CallTagSyncStatusActivity.java
          assert_absent 'new Button(this)' app/src/main/java/kr/pagero/calltag/CallTagSyncStatusActivity.java

          # Task time selection uses CallTag chips, never the system AM/PM TimePicker in Home editor.
          test -e app/src/main/java/kr/pagero/calltag/TaskTimeChoiceDialog.java
          grep -F 'TaskTimeChoiceDialog.show' app/src/main/java/kr/pagero/calltag/HomeTaskEditorActivity.java
          assert_absent 'TimePickerDialog' app/src/main/java/kr/pagero/calltag/HomeTaskEditorActivity.java
          grep -F 'TextView am = choice(context, "오전")' app/src/main/java/kr/pagero/calltag/TaskTimeChoiceDialog.java
          grep -F 'TextView pm = choice(context, "오후")' app/src/main/java/kr/pagero/calltag/TaskTimeChoiceDialog.java

          # Group / bulk-message UI uses CallTag dark components.
          grep -F 'CallTagSpinnerAdapter' app/src/main/java/kr/pagero/calltag/MessageGroupActivity.java
          grep -F 'CallTagDialogStyler.apply(dialog)' app/src/main/java/kr/pagero/calltag/MessageGroupActivity.java
          assert_absent 'simple_spinner_dropdown_item' app/src/main/java/kr/pagero/calltag/MessageGroupActivity.java
          grep -F 'bg_selected_row' app/src/main/java/kr/pagero/calltag/GroupCampaignHubActivity.java

          # Smart groups no longer expose or evaluate transaction status.
          assert_absent '거래 여부' app/src/main/java/kr/pagero/calltag/MessageGroupActivity.java
          assert_absent '거래 고객만' app/src/main/java/kr/pagero/calltag/MessageGroupActivity.java
          assert_absent '미거래 고객만' app/src/main/java/kr/pagero/calltag/MessageGroupActivity.java
          assert_absent 'customer.firstTransactionAt' app/src/main/java/kr/pagero/calltag/MessageGroupStore.java
          grep -F 'values.put("transaction_mode", TRANSACTION_ANY)' app/src/main/java/kr/pagero/calltag/MessageGroupStore.java

          # Status bar and core layout regressions remain fixed.
          grep -F 'controller.show(WindowInsets.Type.statusBars()' app/src/main/java/kr/pagero/calltag/SystemBarInsetsInstaller.java
          grep -F 'controller.setSystemBarsAppearance(0, lightMask)' app/src/main/java/kr/pagero/calltag/SystemBarInsetsInstaller.java
          assert_absent 'fitsSystemWindows="true"' app/src/main/res/layout/activity_main.xml
          assert_absent 'RecentCallHistoryView' app/src/main/res/layout/section_consultations.xml

          # Post-call auto-message remains a large standalone entry in More.
          grep -F 'featuredAutomationCard()' app/src/main/java/kr/pagero/calltag/MoreSettingsHubView.java
          grep -F 'title.setText("통화 후 자동문자")' app/src/main/java/kr/pagero/calltag/MoreSettingsHubView.java
          assert_absent 'messages.add("자동문자"' app/src/main/java/kr/pagero/calltag/MoreSettingsHubView.java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: calltag-v0.44.7-code85-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run phone CRM regression tests on Android 16
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --stacktrace

      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calltag-v0.44.7-code85-instrumentation-results
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: ignore
