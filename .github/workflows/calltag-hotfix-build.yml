name: CallTag 0.44.1 Play-safe phone CRM regression

on:
  workflow_dispatch:
  push:
    branches:
      - agent/play-internal-v0430-run2
      - agent/calltag-v0441-play-policy
  pull_request:
    branches:
      - agent/play-internal-v0430-run2

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify 0.44.1 policy-safe phone CRM contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'versionCode 79' app/build.gradle
          grep -F "versionName '0.44.1'" app/build.gradle
          grep -F 'targetSdk 36' app/build.gradle
          grep -F 'android.permission.READ_CALL_LOG' app/src/main/AndroidManifest.xml
          ! grep -F 'android.permission.WRITE_CALL_LOG' app/src/main/AndroidManifest.xml
          test ! -e app/src/main/java/kr/pagero/calltag/CallLogMemoSyncManager.java
          ! grep -R -F 'CallLog.Calls.CACHED_NAME' app/src/main/java app/src/main/AndroidManifest.xml
          ! grep -R -F 'CallLogMemoSyncManager' app/src/main/java app/src/androidTest
          ! grep -R -F 'hasCallLogWrite' app/src/main/java
          ! grep -R -F 'Manifest.permission.WRITE_CALL_LOG' app/src/main/java
          ! grep -F 'addIfMissing(missing, Manifest.permission.WRITE_CONTACTS)' app/src/main/java/kr/pagero/calltag/InitialPermissionActivity.java
          ! grep -F 'createAppRawContact' app/src/main/java/kr/pagero/calltag/ContactNameSyncManager.java
          ! grep -F 'TYPE_KEEP_TOGETHER' app/src/main/java/kr/pagero/calltag/ContactNameSyncManager.java
          ! grep -F 'StructuredName.DISPLAY_NAME' app/src/main/java/kr/pagero/calltag/ContactNameSyncManager.java
          grep -F 'android.telecom.CallScreeningService' app/src/main/AndroidManifest.xml
          grep -F 'extends CallScreeningService' app/src/main/java/kr/pagero/calltag/CallTagScreeningService.java
          grep -F 'listRecentInteractions' app/src/main/java/kr/pagero/calltag/RecentCallHistoryView.java
          grep -F 'RecentCallHistoryView' app/src/main/res/layout/section_consultations.xml
          grep -F 'calltag_db_only' app/src/main/java/kr/pagero/calltag/PostCallActivity.java
          grep -F 'postCallFieldsScroll' app/src/main/res/layout/activity_post_call.xml
          grep -F 'todayWindow()' app/src/main/java/kr/pagero/calltag/MainActivityCardInteractionFix.java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: calltag-v0.44.1-code79-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run 8 P0 regression tests on Android 16
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --stacktrace

      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calltag-v0.44.1-code79-instrumentation-results
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: ignore
