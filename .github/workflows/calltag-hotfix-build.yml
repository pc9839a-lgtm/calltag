name: CallTag 0.44.4 signed update build
# Artifact-only workflow for installing/testing and Play Console update.

on:
  workflow_dispatch:
  push:
    branches:
      - agent/calltag-v0444-postcall-exclusion-ui
  pull_request:
    branches:
      - agent/calltag-v0443-play-aab

permissions:
  contents: read
  actions: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify 0.44.4 contracts
        shell: bash
        run: |
          set -euo pipefail
          assert_absent() {
            local pattern="$1"
            shift
            if grep -R -F -- "$pattern" "$@"; then
              echo "::error::Forbidden pattern found: $pattern"
              exit 1
            fi
          }

          grep -F 'versionCode 82' app/build.gradle
          grep -F "versionName '0.44.4'" app/build.gradle
          grep -F 'targetSdk 36' app/build.gradle
          grep -F 'android.permission.READ_CALL_LOG' app/src/main/AndroidManifest.xml
          assert_absent 'android.permission.WRITE_CALL_LOG' app/src/main/AndroidManifest.xml
          assert_absent 'android.permission.USE_FULL_SCREEN_INTENT' app/src/main/AndroidManifest.xml
          assert_absent 'android.permission.SYSTEM_ALERT_WINDOW' app/src/main/AndroidManifest.xml
          test ! -e app/src/main/java/kr/pagero/calltag/CallLogMemoSyncManager.java
          assert_absent 'values.put(CallLog.Calls.CACHED_NAME' app/src/main/java
          assert_absent 'CallLogMemoSyncManager' app/src/main/java app/src/androidTest
          assert_absent 'Manifest.permission.WRITE_CALL_LOG' app/src/main/java
          assert_absent 'addIfMissing(missing, Manifest.permission.WRITE_CONTACTS)' app/src/main/java/kr/pagero/calltag/InitialPermissionActivity.java
          assert_absent 'createAppRawContact' app/src/main/java/kr/pagero/calltag/ContactNameSyncManager.java
          assert_absent 'TYPE_KEEP_TOGETHER' app/src/main/java/kr/pagero/calltag/ContactNameSyncManager.java
          assert_absent 'StructuredName.DISPLAY_NAME' app/src/main/java/kr/pagero/calltag/ContactNameSyncManager.java
          grep -F 'android.telecom.CallScreeningService' app/src/main/AndroidManifest.xml
          grep -F 'RoleManager.ROLE_CALL_SCREENING' app/src/main/java/kr/pagero/calltag/CallerIdSetupActivity.java
          grep -F 'CallProcessingLedger' app/src/main/java/kr/pagero/calltag/CallMonitorService.java
          grep -F 'recoverCallsAfterRestart' app/src/main/java/kr/pagero/calltag/CallMonitorService.java
          grep -F 'PostCallRecoveryStore.arm' app/src/main/java/kr/pagero/calltag/CallMonitorService.java
          grep -F 'CallInteractionDeduper.insertOnce' app/src/main/java/kr/pagero/calltag/PostCallActivity.java
          grep -F 'CallDisposition.needsFollowUp' app/src/main/java/kr/pagero/calltag/CallMonitorService.java
          grep -F 'postCallFieldsScroll' app/src/main/res/layout/activity_post_call.xml
          grep -F 'android:visibility="gone"' app/src/main/res/layout/activity_post_call.xml
          grep -F 'todayWindow()' app/src/main/java/kr/pagero/calltag/MainActivityCardInteractionFix.java
          grep -F 'referralCode' app/src/main/java/kr/pagero/calltag/AuthApiClient.java
          grep -F '통합권 7일 추가, 총 14일 무료' app/src/main/java/kr/pagero/calltag/LoginActivity.java
          grep -F '추천인 코드는 회원가입 시 1회만 입력' app/src/main/java/kr/pagero/calltag/ReferralPartnerActivity.java
          test ! -e app/src/main/java/kr/pagero/calltag/ReferralAutoApplyManager.java
          assert_absent 'applyPendingReferral' app/src/main/java/kr/pagero/calltag/AuthGateActivity.java
          assert_absent 'ReferralAutoApplyManager' app/src/main/java
          grep -F '"페이지로 연동"' app/src/main/java/kr/pagero/calltag/MoreSettingsHubView.java
          grep -F '"페이지로 서비스 안내"' app/src/main/java/kr/pagero/calltag/MoreSettingsHubView.java
          grep -F '"파트너 정산"' app/src/main/java/kr/pagero/calltag/MoreSettingsHubView.java
          grep -F 'https://calltag.pagero.kr/web/settlement' app/src/main/java/kr/pagero/calltag/PartnerSettlementActivity.java
          grep -F 'SystemBarInsetsInstaller.install' app/src/main/java/kr/pagero/calltag/CallTagApplication.java
          grep -F 'HomeTaskRefreshStore.mark' app/src/main/java/kr/pagero/calltag/HomeTaskEditorActivity.java
          grep -F 'HomeTaskRefreshStore.consume' app/src/main/java/kr/pagero/calltag/CallTagApplication.java
          grep -F 'deletePending' app/src/main/java/kr/pagero/calltag/PendingCallStore.java
          grep -F 'actionButton("삭제"' app/src/main/java/kr/pagero/calltag/PendingCallSectionView.java
          assert_absent 'RecentCallHistoryView' app/src/main/res/layout/section_consultations.xml
          grep -F 'onTouchEvent(MotionEvent event)' app/src/main/java/kr/pagero/calltag/StatsTrendChartView.java

          # v0.44.4 post-call contract: automatic compact popup is primary; notification is fallback only.
          grep -F 'auto_popup_attempt' app/src/main/java/kr/pagero/calltag/PostCallActivityLauncher.java
          grep -F 'pending.send(' app/src/main/java/kr/pagero/calltag/PostCallActivityLauncher.java
          grep -F 'setPendingIntentBackgroundActivityStartMode' app/src/main/java/kr/pagero/calltag/PostCallActivityLauncher.java
          grep -F 'setPendingIntentCreatorBackgroundActivityStartMode' app/src/main/java/kr/pagero/calltag/PostCallActivityLauncher.java
          grep -F 'PostCallDeliveryGuard.schedule' app/src/main/java/kr/pagero/calltag/PostCallActivityLauncher.java
          grep -F 'PostCallExclusionStore.contains' app/src/main/java/kr/pagero/calltag/PostCallActivityLauncher.java
          grep -F 'PostCallExclusionStore.contains' app/src/main/java/kr/pagero/calltag/CallPopupNotificationManager.java
          grep -F 'canNotify(context, POST_CALL_CHANNEL_ID)' app/src/main/java/kr/pagero/calltag/CallPopupNotificationManager.java
          grep -F 'foreground_activity_retry' app/src/main/java/kr/pagero/calltag/PostCallRecoveryStore.java
          grep -F 'postCallLauncher_fromApplicationContext_reachesCompactPopup' app/src/androidTest/java/kr/pagero/calltag/CrashRegressionTest.java
          grep -F 'postCallNotification_blockedChannelKeepsRecoveryPending' app/src/androidTest/java/kr/pagero/calltag/CrashRegressionTest.java
          grep -F 'postCallRecovery_foregroundOpensCompactPopup' app/src/androidTest/java/kr/pagero/calltag/CrashRegressionTest.java
          grep -F 'postCallExclusion_blocksBackgroundDeliveryAndClearsRecovery' app/src/androidTest/java/kr/pagero/calltag/CrashRegressionTest.java
          grep -F '"팝업 제외"' app/src/main/java/kr/pagero/calltag/CallPopupNotificationManager.java
          grep -F 'PostCallExclusionReceiver' app/src/main/AndroidManifest.xml
          grep -F 'PostCallExclusionActivity' app/src/main/AndroidManifest.xml
          grep -F '"통화 후 팝업 제외"' app/src/main/java/kr/pagero/calltag/MoreSettingsHubView.java
          grep -F '#9198A2' app/src/main/res/drawable/bg_secondary_button.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: calltag-v0.44.4-code82-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android 16 regression tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --stacktrace

      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calltag-v0.44.4-code82-instrumentation-results
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: ignore

      - name: Restore verified Play upload key
        env:
          GH_TOKEN: ${{ github.token }}
          SECRET_UPLOAD_KEYSTORE_BASE64: ${{ secrets.CALLTAG_UPLOAD_KEYSTORE_BASE64 }}
          SECRET_UPLOAD_STORE_PASSWORD: ${{ secrets.CALLTAG_UPLOAD_STORE_PASSWORD }}
          SECRET_UPLOAD_KEY_ALIAS: ${{ secrets.CALLTAG_UPLOAD_KEY_ALIAS }}
          SECRET_UPLOAD_KEY_PASSWORD: ${{ secrets.CALLTAG_UPLOAD_KEY_PASSWORD }}
          ORIGINAL_UPLOAD_KEY_ARTIFACT_ID: '8922836146'
          EXPECTED_UPLOAD_KEY_SHA256: 'C3:4C:98:88:9B:0C:88:8A:BB:39:94:6C:80:16:96:C2:89:E2:82:6C:10:0F:41:7A:0B:CE:25:A3:92:C4:72:A7'
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/calltag-upload.jks"
          configured=0
          for value in "$SECRET_UPLOAD_KEYSTORE_BASE64" "$SECRET_UPLOAD_STORE_PASSWORD" "$SECRET_UPLOAD_KEY_ALIAS" "$SECRET_UPLOAD_KEY_PASSWORD"
          do
            [ -n "$value" ] && configured=$((configured + 1))
          done
          if [ "$configured" -ne 0 ] && [ "$configured" -ne 4 ]; then
            echo '::error::Upload-key Secrets are only partially configured.'
            exit 1
          fi
          if [ "$configured" -eq 4 ]; then
            printf '%s' "$SECRET_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            STORE_PASSWORD="$SECRET_UPLOAD_STORE_PASSWORD"
            KEY_ALIAS="$SECRET_UPLOAD_KEY_ALIAS"
            KEY_PASSWORD="$SECRET_UPLOAD_KEY_PASSWORD"
          else
            mkdir -p "$RUNNER_TEMP/original-upload-key"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ORIGINAL_UPLOAD_KEY_ARTIFACT_ID}/zip" > "$RUNNER_TEMP/original-upload-key.zip"
            unzip -q "$RUNNER_TEMP/original-upload-key.zip" -d "$RUNNER_TEMP/original-upload-key"
            cp "$RUNNER_TEMP/original-upload-key/calltag-upload.jks" "$KEYSTORE"
            CREDENTIALS="$RUNNER_TEMP/original-upload-key/CALLTAG_UPLOAD_KEY_CREDENTIALS.txt"
            STORE_PASSWORD="$(grep '^CALLTAG_UPLOAD_STORE_PASSWORD=' "$CREDENTIALS" | cut -d= -f2-)"
            KEY_ALIAS="$(grep '^CALLTAG_UPLOAD_KEY_ALIAS=' "$CREDENTIALS" | cut -d= -f2-)"
            KEY_PASSWORD="$(grep '^CALLTAG_UPLOAD_KEY_PASSWORD=' "$CREDENTIALS" | cut -d= -f2-)"
          fi
          test -s "$KEYSTORE"
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          chmod 600 "$KEYSTORE"
          keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" \
            | grep -E 'Alias name:|Owner:|SHA1:|SHA256:' > "$RUNNER_TEMP/upload-key-fingerprints.txt"
          grep -F "SHA256: $EXPECTED_UPLOAD_KEY_SHA256" "$RUNNER_TEMP/upload-key-fingerprints.txt"
          {
            echo "CALLTAG_UPLOAD_KEYSTORE_PATH=$KEYSTORE"
            echo "CALLTAG_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD"
            echo "CALLTAG_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "CALLTAG_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
            echo "CALLTAG_EXPECTED_UPLOAD_KEY_SHA256=$EXPECTED_UPLOAD_KEY_SHA256"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK and Play AAB
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Verify and stage signed artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          AAB='app/build/outputs/bundle/release/app-release.aab'
          test -s "$APK"
          test -s "$AAB"

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          APK_VERIFY="$RUNNER_TEMP/apk-verify.txt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$APK_VERIFY"
          EXPECTED_APK_CERT="$(printf '%s' "$CALLTAG_EXPECTED_UPLOAD_KEY_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          ACTUAL_APK_CERT="$(grep -i 'certificate SHA-256 digest:' "$APK_VERIFY" | head -n 1 | sed 's/.*digest: //' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_APK_CERT" = "$EXPECTED_APK_CERT"

          jarsigner -verify -certs "$AAB"
          keytool -printcert -jarfile "$AAB" > "$RUNNER_TEMP/aab-cert.txt"
          grep -F "SHA256: $CALLTAG_EXPECTED_UPLOAD_KEY_SHA256" "$RUNNER_TEMP/aab-cert.txt"

          OUT="$RUNNER_TEMP/calltag-v0.44.4-release"
          mkdir -p "$OUT"
          cp "$APK" "$OUT/CallTag-v0.44.4-code82-release.apk"
          cp "$AAB" "$OUT/CallTag-v0.44.4-code82.aab"
          sha256sum "$APK" > "$OUT/CALLTAG_V0444_APK_SHA256.txt"
          sha256sum "$AAB" > "$OUT/CALLTAG_V0444_AAB_SHA256.txt"
          cp "$RUNNER_TEMP/upload-key-fingerprints.txt" "$OUT/CALLTAG_UPLOAD_KEY_FINGERPRINTS.txt"
          cp "$RUNNER_TEMP/apk-verify.txt" "$OUT/CALLTAG_V0444_APK_SIGNATURE_VERIFY.txt"
          cp "$RUNNER_TEMP/aab-cert.txt" "$OUT/CALLTAG_V0444_AAB_CERTIFICATE.txt"

      - name: Upload signed update artifacts
        uses: actions/upload-artifact@v4
        with:
          name: calltag-v0.44.4-code82-signed-update
          path: ${{ runner.temp }}/calltag-v0.44.4-release
          retention-days: 90
          if-no-files-found: error
