name: TEMP CallTag code88 security patch runner

on:
  pull_request:
    branches:
      - agent/play-internal-v0430-run2

permissions:
  contents: write

jobs:
  patch-code88:
    if: github.event.pull_request.head.ref == 'agent/calltag-v04410-security-hardening'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: agent/calltag-v04410-security-hardening
          fetch-depth: 0
      - name: Apply code88 hardening and restore canonical CI
        run: python3 scripts/run_security_patch_code88.py
      - name: Commit hardened source without workflow mutations
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD -- \
            .github/workflows/calltag-hotfix-build.yml \
            .github/workflows/calltag-security-hardening.yml \
            .github/workflows/v04410-security-patch.yml \
            .github/workflows/v04410-security-trigger.yml
          git config user.name 'openai-agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Harden Android security boundaries for code88'
          git push origin HEAD:agent/calltag-v04410-security-hardening
