name: CallTag 0.43.7 crash hardening

on:
  workflow_dispatch:
  push:
    branches:
      - agent/play-internal-v0430-run2
      - agent/calltag-v0437-crash-hardening
  pull_request:
    branches:
      - agent/play-internal-v0430-run2

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: calltag-v0.43.7-code75-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run P0 crash regression tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --stacktrace

      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calltag-v0.43.7-code75-instrumentation-results
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: ignore

      - name: Prepare release signing
        id: signing
        env:
          KS_B64_1: ${{ secrets.CALLTAG_UPLOAD_KEYSTORE_BASE64 }}
          KS_B64_2: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KS_B64_3: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_B64_4: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS_1: ${{ secrets.CALLTAG_UPLOAD_STORE_PASSWORD }}
          STORE_PASS_2: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          STORE_PASS_3: ${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS_1: ${{ secrets.CALLTAG_UPLOAD_KEY_ALIAS }}
          ALIAS_2: ${{ secrets.UPLOAD_KEY_ALIAS }}
          ALIAS_3: ${{ secrets.KEY_ALIAS }}
          KEY_PASS_1: ${{ secrets.CALLTAG_UPLOAD_KEY_PASSWORD }}
          KEY_PASS_2: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          KEY_PASS_3: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_B64="${KS_B64_1:-${KS_B64_2:-${KS_B64_3:-${KS_B64_4:-}}}}"
          STORE_PASSWORD="${STORE_PASS_1:-${STORE_PASS_2:-${STORE_PASS_3:-}}}"
          KEY_ALIAS_VALUE="${ALIAS_1:-${ALIAS_2:-${ALIAS_3:-}}}"
          KEY_PASSWORD_VALUE="${KEY_PASS_1:-${KEY_PASS_2:-${KEY_PASS_3:-}}}"
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS_VALUE" ] || [ -z "$KEY_PASSWORD_VALUE" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are missing; skipping AAB build."
            exit 0
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/calltag-upload.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "CALLTAG_UPLOAD_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "CALLTAG_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "CALLTAG_UPLOAD_KEY_ALIAS=$KEY_ALIAS_VALUE" >> "$GITHUB_ENV"
          echo "CALLTAG_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD_VALUE" >> "$GITHUB_ENV"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release AAB
        if: steps.signing.outputs.available == 'true'
        run: gradle :app:bundleRelease --stacktrace

      - name: Upload release AAB
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: calltag-v0.43.7-code75-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
