name: CallTag 0.44.6 signed Play build
# Artifact-only workflow. Never merge this branch into product.

on:
  workflow_dispatch:
  push:
    branches:
      - agent/calltag-v0446-play-aab
  pull_request:
    branches:
      - agent/play-internal-v0430-run2

permissions:
  contents: read
  actions: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify 0.44.6 release contracts
        shell: bash
        run: |
          set -euo pipefail
          assert_absent() {
            local pattern="$1"
            shift
            if grep -R -F -- "$pattern" "$@"; then
              echo "::error::Forbidden pattern found: $pattern"
              exit 1
            fi
          }

          grep -F 'versionCode 84' app/build.gradle
          grep -F "versionName '0.44.6'" app/build.gradle
          grep -F 'targetSdk 36' app/build.gradle

          # Play-safe phone CRM contract.
          grep -F 'android.permission.READ_CALL_LOG' app/src/main/AndroidManifest.xml
          assert_absent 'android.permission.WRITE_CALL_LOG' app/src/main/AndroidManifest.xml
          assert_absent 'values.put(CallLog.Calls.CACHED_NAME' app/src/main/java
          assert_absent 'Manifest.permission.WRITE_CALL_LOG' app/src/main/java
          test ! -e app/src/main/java/kr/pagero/calltag/CallLogMemoSyncManager.java
          grep -F 'CallProcessingLedger' app/src/main/java/kr/pagero/calltag/CallMonitorService.java
          grep -F 'CallInteractionDeduper.insertOnce' app/src/main/java/kr/pagero/calltag/PostCallActivity.java

          # Customer Add mirrors device CallLog without hiding registered/repeated calls.
          grep -F 'CallLog.Calls.DATE + " DESC"' app/src/main/java/kr/pagero/calltag/CustomerAddActivity.java
          assert_absent 'seen.contains' app/src/main/java/kr/pagero/calltag/CustomerAddActivity.java
          assert_absent 'if (db.findByPhone(number) != null) continue' app/src/main/java/kr/pagero/calltag/CustomerAddActivity.java

          # Referral and PageRo contracts.
          grep -F '통합권 7일 추가, 총 14일 무료' app/src/main/java/kr/pagero/calltag/LoginActivity.java
          grep -F '기본 7일 · 추천인 입력 시 +7일 · 총 14일' app/src/main/java/kr/pagero/calltag/BillingEntitlementActivity.java
          grep -F 'PageroConnectionCompactActivity.class' app/src/main/java/kr/pagero/calltag/MoreSettingsHubView.java
          grep -F 'PageroUseGuideActivity.class' app/src/main/java/kr/pagero/calltag/MoreSettingsHubView.java
          grep -F 'https://calltag.pagero.kr/web/settlement' app/src/main/java/kr/pagero/calltag/PartnerSettlementActivity.java

          # Compact post-call and pending-call task routes.
          grep -F 'PostCallPopupWindowInstaller.install(this);' app/src/main/java/kr/pagero/calltag/PostCallActivity.java
          grep -F 'activity_not_visible_notification_only' app/src/main/java/kr/pagero/calltag/PostCallDeliveryGuard.java
          assert_absent 'app.startActivity' app/src/main/java/kr/pagero/calltag/PostCallDeliveryGuard.java
          grep -F 'HomeTaskEditorActivity.class' app/src/main/java/kr/pagero/calltag/PendingCallSectionView.java
          assert_absent 'PostCallActivity.class' app/src/main/java/kr/pagero/calltag/PendingCallSectionView.java

          # code84 statistics / dark UI / task-time UX.
          grep -F 'tooltipPaint.setColor(getContext().getColor(R.color.surface_soft))' app/src/main/java/kr/pagero/calltag/StatsTrendChartView.java
          grep -F 'tooltipTextPaint.setColor(getContext().getColor(R.color.text_primary))' app/src/main/java/kr/pagero/calltag/StatsTrendChartView.java
          assert_absent 'Color.rgb(248, 250, 252)' app/src/main/java/kr/pagero/calltag/BillingEntitlementActivity.java
          grep -F 'root.setBackgroundColor(getColor(R.color.background))' app/src/main/java/kr/pagero/calltag/CallTagSyncStatusActivity.java
          test -e app/src/main/java/kr/pagero/calltag/TaskTimeChoiceDialog.java
          grep -F 'TaskTimeChoiceDialog.show' app/src/main/java/kr/pagero/calltag/HomeTaskEditorActivity.java
          assert_absent 'TimePickerDialog' app/src/main/java/kr/pagero/calltag/HomeTaskEditorActivity.java

          # Group / bulk message and smart-group cleanup.
          grep -F 'CallTagSpinnerAdapter' app/src/main/java/kr/pagero/calltag/MessageGroupActivity.java
          assert_absent '거래 여부' app/src/main/java/kr/pagero/calltag/MessageGroupActivity.java
          assert_absent 'customer.firstTransactionAt' app/src/main/java/kr/pagero/calltag/MessageGroupStore.java
          grep -F 'values.put("transaction_mode", TRANSACTION_ANY)' app/src/main/java/kr/pagero/calltag/MessageGroupStore.java

          # Customer / message hub optimized routes.
          grep -F 'compactButton("문자 보내기", true)' app/src/main/java/kr/pagero/calltag/CustomerListView.java
          grep -F 'card.setOnClickListener(v -> openCustomer(customerId))' app/src/main/java/kr/pagero/calltag/CustomerListView.java
          grep -F 'primaryAction("고객 선택 후 문자")' app/src/main/java/kr/pagero/calltag/MessageSectionView.java
          grep -F 'LinearLayout automation = automationCard()' app/src/main/java/kr/pagero/calltag/MessageSectionView.java
          grep -F 'MessageAutomationSettingsActivity.class' app/src/main/java/kr/pagero/calltag/MessageSectionView.java
          assert_absent 'addMenuRow(menu, "통화 후 자동문자"' app/src/main/java/kr/pagero/calltag/MessageSectionView.java

          # More keeps automatic SMS as its own large shortcut too, not buried in settings rows.
          grep -F 'featuredAutomationCard()' app/src/main/java/kr/pagero/calltag/MoreSettingsHubView.java
          grep -F 'title.setText("통화 후 자동문자")' app/src/main/java/kr/pagero/calltag/MoreSettingsHubView.java
          assert_absent 'messages.add("자동문자"' app/src/main/java/kr/pagero/calltag/MoreSettingsHubView.java

          # Calendar/status-bar regressions stay fixed.
          assert_absent 'RecentCallHistoryView' app/src/main/res/layout/section_consultations.xml
          grep -F 'controller.show(WindowInsets.Type.statusBars()' app/src/main/java/kr/pagero/calltag/SystemBarInsetsInstaller.java
          grep -F 'controller.setSystemBarsAppearance(0, lightMask)' app/src/main/java/kr/pagero/calltag/SystemBarInsetsInstaller.java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: calltag-v0.44.6-code84-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run phone CRM regression tests on Android 16
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --stacktrace

      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calltag-v0.44.6-code84-instrumentation-results
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: ignore

      - name: Restore verified Play upload key
        env:
          GH_TOKEN: ${{ github.token }}
          SECRET_UPLOAD_KEYSTORE_BASE64: ${{ secrets.CALLTAG_UPLOAD_KEYSTORE_BASE64 }}
          SECRET_UPLOAD_STORE_PASSWORD: ${{ secrets.CALLTAG_UPLOAD_STORE_PASSWORD }}
          SECRET_UPLOAD_KEY_ALIAS: ${{ secrets.CALLTAG_UPLOAD_KEY_ALIAS }}
          SECRET_UPLOAD_KEY_PASSWORD: ${{ secrets.CALLTAG_UPLOAD_KEY_PASSWORD }}
          ORIGINAL_UPLOAD_KEY_ARTIFACT_ID: '8922836146'
          EXPECTED_UPLOAD_KEY_SHA256: 'C3:4C:98:88:9B:0C:88:8A:BB:39:94:6C:80:16:96:C2:89:E2:82:6C:10:0F:41:7A:0B:CE:25:A3:92:C4:72:A7'
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/calltag-upload.jks"
          configured=0
          for value in "$SECRET_UPLOAD_KEYSTORE_BASE64" "$SECRET_UPLOAD_STORE_PASSWORD" "$SECRET_UPLOAD_KEY_ALIAS" "$SECRET_UPLOAD_KEY_PASSWORD"
          do
            [ -n "$value" ] && configured=$((configured + 1))
          done
          if [ "$configured" -ne 0 ] && [ "$configured" -ne 4 ]; then
            echo '::error::Upload-key Secrets are only partially configured.'
            exit 1
          fi
          if [ "$configured" -eq 4 ]; then
            printf '%s' "$SECRET_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            STORE_PASSWORD="$SECRET_UPLOAD_STORE_PASSWORD"
            KEY_ALIAS="$SECRET_UPLOAD_KEY_ALIAS"
            KEY_PASSWORD="$SECRET_UPLOAD_KEY_PASSWORD"
          else
            mkdir -p "$RUNNER_TEMP/original-upload-key"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ORIGINAL_UPLOAD_KEY_ARTIFACT_ID}/zip" > "$RUNNER_TEMP/original-upload-key.zip"
            unzip -q "$RUNNER_TEMP/original-upload-key.zip" -d "$RUNNER_TEMP/original-upload-key"
            cp "$RUNNER_TEMP/original-upload-key/calltag-upload.jks" "$KEYSTORE"
            CREDENTIALS="$RUNNER_TEMP/original-upload-key/CALLTAG_UPLOAD_KEY_CREDENTIALS.txt"
            STORE_PASSWORD="$(grep '^CALLTAG_UPLOAD_STORE_PASSWORD=' "$CREDENTIALS" | cut -d= -f2-)"
            KEY_ALIAS="$(grep '^CALLTAG_UPLOAD_KEY_ALIAS=' "$CREDENTIALS" | cut -d= -f2-)"
            KEY_PASSWORD="$(grep '^CALLTAG_UPLOAD_KEY_PASSWORD=' "$CREDENTIALS" | cut -d= -f2-)"
          fi
          test -s "$KEYSTORE"
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          chmod 600 "$KEYSTORE"
          keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" \
            | grep -E 'Alias name:|Owner:|SHA1:|SHA256:' > "$RUNNER_TEMP/upload-key-fingerprints.txt"
          grep -F "SHA256: $EXPECTED_UPLOAD_KEY_SHA256" "$RUNNER_TEMP/upload-key-fingerprints.txt"
          {
            echo "CALLTAG_UPLOAD_KEYSTORE_PATH=$KEYSTORE"
            echo "CALLTAG_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD"
            echo "CALLTAG_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "CALLTAG_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed Play release AAB
        run: gradle :app:bundleRelease --no-daemon --stacktrace

      - name: Verify and stage signed AAB
        shell: bash
        run: |
          set -euo pipefail
          AAB='app/build/outputs/bundle/release/app-release.aab'
          test -s "$AAB"
          jarsigner -verify -certs "$AAB"
          OUT="$RUNNER_TEMP/calltag-v0.44.6-play"
          mkdir -p "$OUT"
          cp "$AAB" "$OUT/CallTag-v0.44.6-code84.aab"
          sha256sum "$AAB" > "$OUT/CALLTAG_V0446_AAB_SHA256.txt"
          cp "$RUNNER_TEMP/upload-key-fingerprints.txt" "$OUT/CALLTAG_UPLOAD_KEY_FINGERPRINTS.txt"

      - name: Upload Play Console AAB
        uses: actions/upload-artifact@v4
        with:
          name: calltag-v0.44.6-code84-play-aab
          path: ${{ runner.temp }}/calltag-v0.44.6-play
          retention-days: 90
          if-no-files-found: error
