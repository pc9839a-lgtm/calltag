name: Verify CallTag live guide CTA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-calltag-live-guide-cta.yml'

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare Pages production
        shell: bash
        run: |
          set -euo pipefail
          URL='https://calltag.pagero.kr/guide/insurance-agent-customer-management/'
          for i in $(seq 1 24); do
            HTML="$(curl -fsSL --max-time 15 "$URL" || true)"
            if printf '%s' "$HTML" | grep -Fq 'guide-sticky-cta' && printf '%s' "$HTML" | grep -Fq '보험 전용 CRM이 필요한지'; then
              echo "LIVE_OK attempt=$i"
              exit 0
            fi
            echo "waiting attempt=$i"
            sleep 10
          done
          echo "LIVE_NOT_UPDATED"
          exit 1
