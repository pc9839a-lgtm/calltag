name: Verify Meta CRM guide live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-meta-crm-guide-live.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Poll production
        shell: bash
        run: |
          set -euo pipefail
          URL='https://calltag.pagero.kr/guide/meta-lead-ads-customer-management/'
          HUB='https://calltag.pagero.kr/guide/'
          for i in $(seq 1 24); do
            HTML="$(curl -fsSL --max-time 15 "$URL" || true)"
            HUBHTML="$(curl -fsSL --max-time 15 "$HUB" || true)"
            OK=1
            printf '%s' "$HTML" | grep -Fq '<title>Meta 리드 광고 CRM 연동: 인스턴트폼 DB부터 후속상담까지 | 콜태그</title>' || OK=0
            printf '%s' "$HTML" | grep -Fq 'CRM용 전환 API는' || OK=0
            printf '%s' "$HTML" | grep -Fq '콜태그 무료로 시작' || OK=0
            printf '%s' "$HTML" | grep -Fq 'href="https://calltag.pagero.kr/">무료로 시작</a>' || OK=0
            printf '%s' "$HUBHTML" | grep -Fq 'Meta 리드 광고 CRM 연동, 인스턴트폼 DB부터 후속상담까지' || OK=0
            if [ "$OK" -eq 1 ]; then
              echo "LIVE_OK attempt=$i"
              exit 0
            fi
            echo "waiting attempt=$i"
            sleep 10
          done
          echo "LIVE_NOT_UPDATED"
          exit 1
