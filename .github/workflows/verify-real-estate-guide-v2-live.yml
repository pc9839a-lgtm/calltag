name: Verify real estate guide v2 live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-real-estate-guide-v2-live.yml'

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Poll production
        shell: bash
        run: |
          set -euo pipefail
          URL='https://calltag.pagero.kr/guide/real-estate-customer-management/'
          for i in $(seq 1 24); do
            HTML="$(curl -fsSL --max-time 15 "$URL" || true)"
            if printf '%s' "$HTML" | grep -Fq '무료 부동산 CRM을 찾는다면'               && printf '%s' "$HTML" | grep -Fq '1인 사무소와 팀 사무소는 필요한 CRM 기능이 다릅니다'               && printf '%s' "$HTML" | grep -Fq '부동산 고객관리, 실제 문의로 7일 테스트'               && printf '%s' "$HTML" | grep -Fq 'guide-sticky-cta'; then
              echo "LIVE_OK attempt=$i"
              exit 0
            fi
            echo "waiting attempt=$i"
            sleep 10
          done
          echo "LIVE_NOT_UPDATED"
          exit 1
