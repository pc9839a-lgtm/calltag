name: CallTag 0.44.31 Direct Google Login Release

on:
  workflow_dispatch:
  push:
    branches:
      - agent/calltag-v04422-billing-live
    paths:
      - '.github/workflows/calltag-v04431-google-direct-login-release.yml'

permissions:
  contents: read

jobs:
  audited-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit direct Google login structure
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_WEB_CLIENT='31346298247-o5jfdetjs84mu02c8tp68qg19ifo89en.apps.googleusercontent.com'
          grep -F 'versionCode 2026081217' app/build.gradle
          grep -F "versionName '0.44.31'" app/build.gradle
          grep -F "$EXPECTED_WEB_CLIENT" app/build.gradle

          LOGIN='app/src/main/java/kr/pagero/calltag/LoginActivity.java'
          grep -F 'CredentialManager.create(this)' "$LOGIN"
          grep -F 'credentialManager.getCredentialAsync(' "$LOGIN"
          grep -F 'GetSignInWithGoogleOption' "$LOGIN"
          grep -F 'GoogleIdTokenCredential.TYPE_GOOGLE_ID_TOKEN_SIWG_CREDENTIAL' "$LOGIN"
          grep -F 'AuthApiClient.exchangeGoogleIdToken' "$LOGIN"
          grep -F 'null,' "$LOGIN"
          if grep -F 'startActivity(new Intent(this, GoogleCredentialLoginActivity.class))' "$LOGIN"; then
            echo '::error::Bridge Activity is still used by LoginActivity.' >&2
            exit 1
          fi
          if grep -F 'CancellationSignal' "$LOGIN"; then
            echo '::error::LoginActivity must not own a CancellationSignal for Google sign-in.' >&2
            exit 1
          fi

          API='app/src/main/java/kr/pagero/calltag/AuthApiClient.java'
          grep -F 'private static final String PRODUCTION_API_BASE = "https://pagero.kr";' "$API"
          grep -F 'return request(PRODUCTION_API_BASE + "/api/call/google/id-token", "POST"' "$API"

      - name: Verify production Google API contract
        shell: bash
        run: |
          set -euo pipefail
          result="$(curl -sS --connect-timeout 5 --max-time 10 -o body.json -w '%{http_code} %{time_total}' \
            -H 'Content-Type: application/json' \
            --data '{"idToken":"invalid","nonce":"invalid"}' \
            'https://pagero.kr/api/call/google/id-token')"
          status="${result%% *}"
          seconds="${result##* }"
          test "$status" = '401'
          grep -F 'GOOGLE_ID_TOKEN_INVALID' body.json
          python3 - "$seconds" <<'PY'
          import sys
          t=float(sys.argv[1])
          if t >= 5.0:
              raise SystemExit(f'production auth route too slow: {t}s')
          print(f'production auth contract OK in {t:.3f}s')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore accepted Play upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.CALLTAG_UPLOAD_KEYSTORE_BASE64 }}
          CREDENTIALS_TEXT: ${{ secrets.CALLTAG_UPLOAD_CREDENTIALS }}
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA256="$(tr -d '\r\n ' < config/play-upload-key-sha256.txt)"
          CLEAN="$(printf '%s\n' "$CREDENTIALS_TEXT" | tr -d '\r')"
          STORE_PASSWORD="$(printf '%s\n' "$CLEAN" | sed -n 's/^CALLTAG_UPLOAD_STORE_PASSWORD=//p' | tail -n 1)"
          KEY_PASSWORD="$(printf '%s\n' "$CLEAN" | sed -n 's/^CALLTAG_UPLOAD_KEY_PASSWORD=//p' | tail -n 1)"
          KEY_ALIAS='calltag-upload'
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          KEYSTORE="$RUNNER_TEMP/calltag-upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" \
            | grep -E 'Alias name:|Owner:|SHA1:|SHA256:' > "$RUNNER_TEMP/upload-key-fingerprints.txt"
          grep -F "SHA256: $EXPECTED_SHA256" "$RUNNER_TEMP/upload-key-fingerprints.txt"
          {
            echo "CALLTAG_UPLOAD_KEYSTORE_PATH=$KEYSTORE"
            echo "CALLTAG_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD"
            echo "CALLTAG_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "CALLTAG_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
            echo "CALLTAG_EXPECTED_UPLOAD_KEY_SHA256=$EXPECTED_SHA256"
          } >> "$GITHUB_ENV"

      - name: Build signed AAB and APK
        run: gradle :app:bundleRelease :app:assembleRelease --no-daemon --stacktrace

      - name: Inspect compiled release and verify signatures
        shell: bash
        run: |
          set -euo pipefail
          AAB='app/build/outputs/bundle/release/app-release.aab'
          APK='app/build/outputs/apk/release/app-release.apk'
          EXPECTED_WEB_CLIENT='31346298247-o5jfdetjs84mu02c8tp68qg19ifo89en.apps.googleusercontent.com'
          test -s "$AAB"
          test -s "$APK"

          unzip -p "$APK" 'classes*.dex' | strings > "$RUNNER_TEMP/apk-strings.txt"
          grep -F "$EXPECTED_WEB_CLIENT" "$RUNNER_TEMP/apk-strings.txt"
          grep -F 'https://pagero.kr' "$RUNNER_TEMP/apk-strings.txt"
          grep -F 'kr/pagero/calltag/LoginActivity' "$RUNNER_TEMP/apk-strings.txt"

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apk-signature.txt"
          EXPECTED_COMPACT="$(printf '%s' "$CALLTAG_EXPECTED_UPLOAD_KEY_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          ACTUAL_APK="$(grep -i 'certificate SHA-256 digest:' "$RUNNER_TEMP/apk-signature.txt" | head -n 1 | sed 's/.*digest: //' | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_APK" = "$EXPECTED_COMPACT"
          jarsigner -verify -certs "$AAB"
          keytool -printcert -jarfile "$AAB" > "$RUNNER_TEMP/aab-certificate.txt"
          grep -F "SHA256: $CALLTAG_EXPECTED_UPLOAD_KEY_SHA256" "$RUNNER_TEMP/aab-certificate.txt"

          OUT="$RUNNER_TEMP/calltag-v0.44.31-google-direct-login-release"
          mkdir -p "$OUT"
          cp "$AAB" "$OUT/CallTag-v0.44.31-code2026081217.aab"
          cp "$APK" "$OUT/CallTag-v0.44.31-code2026081217-release.apk"
          sha256sum "$AAB" > "$OUT/CALLTAG_V04431_AAB_SHA256.txt"
          sha256sum "$APK" > "$OUT/CALLTAG_V04431_APK_SHA256.txt"
          cp "$RUNNER_TEMP/upload-key-fingerprints.txt" "$OUT/CALLTAG_UPLOAD_KEY_FINGERPRINTS.txt"
          cp "$RUNNER_TEMP/aab-certificate.txt" "$OUT/CALLTAG_V04431_AAB_CERTIFICATE.txt"
          cp "$RUNNER_TEMP/apk-signature.txt" "$OUT/CALLTAG_V04431_APK_SIGNATURE.txt"

      - name: Upload audited release
        uses: actions/upload-artifact@v4
        with:
          name: calltag-v0.44.31-code2026081217-google-direct-login-release
          path: ${{ runner.temp }}/calltag-v0.44.31-google-direct-login-release
          retention-days: 90
          if-no-files-found: error
