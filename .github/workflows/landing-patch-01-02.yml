name: Apply CallTag landing sections 01-02

on:
  push:
    branches:
      - feat/landing-rebuild-sections-01-02-20260916
    paths:
      - '.github/workflows/landing-patch-01-02.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout landing branch
        uses: actions/checkout@v4
        with:
          ref: feat/landing-rebuild-sections-01-02-20260916

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply sections 01-02 patch
        run: python scripts/apply_landing_sections_01_02.py

      - name: Validate landing contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '전화가 끝난 뒤,' index.html
          grep -Fq '고객관리는 그때부터 시작됩니다.' index.html
          grep -Fq '통화는 끝났는데,' index.html
          grep -Fq '콜태그는 이걸 기억으로 관리하지 않게 만듭니다.' index.html
          grep -Fq '7일 무료로 시작하기' index.html
          grep -Fq 'Android 앱' index.html
          grep -Fq 'PC 웹 연동' index.html
          grep -Fq '통화 내용은 자동 분석하지 않습니다.' index.html
          grep -Fq 'id="call-flow"' index.html
          if grep -Fq '3일' index.html; then echo 'stale 3-day copy detected' >&2; exit 1; fi
          if grep -Fq '+7일' index.html; then echo 'stale +7-day referral copy detected' >&2; exit 1; fi

      - name: Commit patched landing
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'No landing diff to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat(landing): rebuild hero and pain sections'
          git push origin HEAD:feat/landing-rebuild-sections-01-02-20260916
