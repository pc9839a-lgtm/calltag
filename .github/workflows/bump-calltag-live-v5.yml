name: Bump CallTag live patch v5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-calltag-live-v5.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Bump v4 to v5
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); old='calltag-landing-live-0102-v1.js?v=20260916-4'; new='calltag-landing-live-0102-v1.js?v=20260916-5'; assert old in s, 'v4 reference not found'; p.write_text(s.replace(old,new,1),encoding='utf-8')"
          node --check assets/calltag-landing-live-0102-v1.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'chore(landing): cache bust section 03 v5'
          git push origin HEAD:main
      - name: Cleanup workflow
        shell: bash
        run: |
          git pull --rebase origin main
          git rm .github/workflows/bump-calltag-live-v5.yml
          git commit -m 'chore(ci): remove v5 cache-bust workflow'
          git push origin HEAD:main
