name: CallTag 0.44.43 Play Upload Release

on:
  push:
    branches:
      - agent/calltag-v04422-billing-live
    paths:
      - '.github/workflows/calltag-v04443-upload-release.yml'
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CALLTAG_FIREBASE_APPLICATION_ID: ${{ secrets.CALLTAG_FIREBASE_APPLICATION_ID }}
      CALLTAG_FIREBASE_API_KEY: ${{ secrets.CALLTAG_FIREBASE_API_KEY }}
      CALLTAG_FIREBASE_PROJECT_ID: ${{ secrets.CALLTAG_FIREBASE_PROJECT_ID }}
      CALLTAG_FIREBASE_SENDER_ID: ${{ secrets.CALLTAG_FIREBASE_SENDER_ID }}
      SECRET_UPLOAD_KEYSTORE_BASE64: ${{ secrets.CALLTAG_UPLOAD_KEYSTORE_BASE64 }}
      SECRET_UPLOAD_CREDENTIALS: ${{ secrets.CALLTAG_UPLOAD_CREDENTIALS }}
      SECRET_UPLOAD_STORE_PASSWORD: ${{ secrets.CALLTAG_UPLOAD_STORE_PASSWORD }}
      SECRET_UPLOAD_KEY_ALIAS: ${{ secrets.CALLTAG_UPLOAD_KEY_ALIAS }}
      SECRET_UPLOAD_KEY_PASSWORD: ${{ secrets.CALLTAG_UPLOAD_KEY_PASSWORD }}
      CALLTAG_VERSION_NAME: '0.44.43'
      CALLTAG_VERSION_CODE: '2026081801'
      RELEASE_TAG: 'calltag-v0.44.43-code2026081801'

    steps:
      - uses: actions/checkout@v4

      - name: Verify release version and Firebase config
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'versionCode 2026081801' app/build.gradle
          grep -F "versionName '0.44.43'" app/build.gradle
          for key in CALLTAG_FIREBASE_APPLICATION_ID CALLTAG_FIREBASE_API_KEY CALLTAG_FIREBASE_PROJECT_ID CALLTAG_FIREBASE_SENDER_ID
          do
            test -n "${!key:-}" || { echo "::error::${key} is not configured"; exit 1; }
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Resolve Play upload credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, sys
          raw = (os.environ.get('SECRET_UPLOAD_CREDENTIALS') or '').strip()
          values = {}
          if raw:
              try:
                  parsed = json.loads(raw)
                  if isinstance(parsed, dict):
                      values.update({str(k): str(v) for k, v in parsed.items() if v is not None})
              except json.JSONDecodeError:
                  for line in raw.splitlines():
                      line = line.strip()
                      if not line or line.startswith('#') or '=' not in line:
                          continue
                      key, value = line.split('=', 1)
                      values[key.strip()] = value.strip().strip('"').strip("'")
          legacy = {
              'CALLTAG_UPLOAD_STORE_PASSWORD': os.environ.get('SECRET_UPLOAD_STORE_PASSWORD', ''),
              'CALLTAG_UPLOAD_KEY_ALIAS': os.environ.get('SECRET_UPLOAD_KEY_ALIAS', ''),
              'CALLTAG_UPLOAD_KEY_PASSWORD': os.environ.get('SECRET_UPLOAD_KEY_PASSWORD', ''),
          }
          for key, value in legacy.items():
              if value:
                  values.setdefault(key, value)
          aliases = {
              'CALLTAG_UPLOAD_STORE_PASSWORD': ('CALLTAG_UPLOAD_STORE_PASSWORD','STORE_PASSWORD','storePassword','store_password','KEYSTORE_PASSWORD','keystorePassword','keystore_password'),
              'CALLTAG_UPLOAD_KEY_ALIAS': ('CALLTAG_UPLOAD_KEY_ALIAS','KEY_ALIAS','keyAlias','key_alias','ALIAS'),
              'CALLTAG_UPLOAD_KEY_PASSWORD': ('CALLTAG_UPLOAD_KEY_PASSWORD','KEY_PASSWORD','keyPassword','key_password'),
          }
          resolved = {}
          for target, candidates in aliases.items():
              for candidate in candidates:
                  value = values.get(candidate, '')
                  if value:
                      resolved[target] = value
                      break
          missing = [key for key in aliases if not resolved.get(key)]
          if not os.environ.get('SECRET_UPLOAD_KEYSTORE_BASE64', '').strip():
              missing.append('CALLTAG_UPLOAD_KEYSTORE_BASE64')
          if missing:
              print('::error::Play upload signing missing: ' + ', '.join(missing))
              sys.exit(1)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              for key, value in resolved.items():
                  env.write(f'{key}={value}\n')
          PY

      - name: Prepare verified Play upload key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/calltag-upload.jks"
          printf '%s' "$SECRET_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "::add-mask::$CALLTAG_UPLOAD_STORE_PASSWORD"
          echo "::add-mask::$CALLTAG_UPLOAD_KEY_PASSWORD"
          keytool -list -v -keystore "$KEYSTORE" -storepass "$CALLTAG_UPLOAD_STORE_PASSWORD" -alias "$CALLTAG_UPLOAD_KEY_ALIAS" \
            | grep -E 'Alias name:|Owner:|SHA1:|SHA256:' > "$RUNNER_TEMP/upload-key-fingerprints.txt"
          EXPECTED_SHA256='C3:4C:98:88:9B:0C:88:8A:BB:39:94:6C:80:16:96:C2:89:E2:82:6C:10:0F:41:7A:0B:CE:25:A3:92:C4:72:A7'
          grep -Fq "SHA256: $EXPECTED_SHA256" "$RUNNER_TEMP/upload-key-fingerprints.txt" || { echo '::error::Wrong Play upload key'; exit 1; }
          {
            echo "CALLTAG_UPLOAD_KEYSTORE_PATH=$KEYSTORE"
            echo "CALLTAG_UPLOAD_STORE_PASSWORD=$CALLTAG_UPLOAD_STORE_PASSWORD"
            echo "CALLTAG_UPLOAD_KEY_ALIAS=$CALLTAG_UPLOAD_KEY_ALIAS"
            echo "CALLTAG_UPLOAD_KEY_PASSWORD=$CALLTAG_UPLOAD_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed release AAB
        run: gradle :app:bundleRelease --no-daemon --stacktrace

      - name: Verify and stage AAB
        shell: bash
        run: |
          set -euo pipefail
          AAB='app/build/outputs/bundle/release/app-release.aab'
          OUT="$RUNNER_TEMP/CallTag-v${CALLTAG_VERSION_NAME}-code${CALLTAG_VERSION_CODE}.aab"
          test -s "$AAB"
          jarsigner -verify -certs "$AAB"
          if jarsigner -verify -verbose -certs "$AAB" | grep -qi 'Android Debug'; then
            echo '::error::Release AAB uses debug certificate'; exit 1
          fi
          cp "$AAB" "$OUT"
          sha256sum "$OUT" > "$RUNNER_TEMP/CallTag-v${CALLTAG_VERSION_NAME}-code${CALLTAG_VERSION_CODE}.sha256.txt"
          echo "RELEASE_AAB=$OUT" >> "$GITHUB_ENV"

      - name: Publish GitHub prerelease asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHA_FILE="$RUNNER_TEMP/CallTag-v${CALLTAG_VERSION_NAME}-code${CALLTAG_VERSION_CODE}.sha256.txt"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_AAB" "$SHA_FILE" --clobber
          else
            gh release create "$RELEASE_TAG" "$RELEASE_AAB" "$SHA_FILE" \
              --target "$GITHUB_SHA" \
              --title "CallTag ${CALLTAG_VERSION_NAME} Play Upload" \
              --notes "Google Play Console upload용 signed AAB. versionCode ${CALLTAG_VERSION_CODE}." \
              --prerelease
          fi

      - name: Create build completion receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          FILE="CallTag-v${CALLTAG_VERSION_NAME}-code${CALLTAG_VERSION_CODE}.aab"
          SHA="$(cut -d' ' -f1 "$RUNNER_TEMP/CallTag-v${CALLTAG_VERSION_NAME}-code${CALLTAG_VERSION_CODE}.sha256.txt")"
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          ASSET_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${FILE}"
          TITLE="[BUILD READY] CallTag ${CALLTAG_VERSION_NAME} code${CALLTAG_VERSION_CODE}"
          BODY=$(printf 'Signed Google Play AAB build completed.\n\n- File: `%s`\n- SHA256: `%s`\n- Release: %s\n- Direct asset: %s\n- Commit: `%s`\n' "$FILE" "$SHA" "$RELEASE_URL" "$ASSET_URL" "$GITHUB_SHA")
          EXISTING="$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
