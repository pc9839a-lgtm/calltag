name: Fix CallTag live landing 01-02 v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-live-landing-0102-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rewrite live landing patch with existing visual language
        shell: bash
        run: |
          cat > assets/calltag-landing-live-0102-v1.js <<'EOF'
          (()=>{
            if(document.documentElement.dataset.ctLanding0102V2)return;
            document.documentElement.dataset.ctLanding0102V2='1';
            const APP='https://pagero.kr/app';
            const TITLE='전화가 끝난 뒤,<br><span>고객관리는 시작됩니다.</span>';
            const DESCRIPTION='고객 · 상담 · 다음 할 일.';
            let applying=false;
            let queued=false;

            const installStyle=()=>{
              let style=document.getElementById('ct-live-0102-style');
              if(!style){style=document.createElement('style');style.id='ct-live-0102-style';document.head.append(style);}
              style.textContent=`
                .ct-live-hero-actions{display:flex;justify-content:center;align-items:center;margin-top:30px}
                .ct-live-hero-primary{min-height:58px;display:inline-flex;align-items:center;justify-content:center;padding:0 30px;border-radius:14px;background:#3b6fff;color:#fff!important;font-size:16px;font-weight:900;text-decoration:none;box-shadow:0 16px 38px rgba(59,111,255,.22)}
                .ct-live-hero-link{display:none!important}
                #ct-live-pain{padding:140px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#0d0f13}
                #ct-live-pain .ct-live-pain-head{text-align:center}
                #ct-live-pain h2{margin:0;font-size:clamp(54px,6.2vw,90px);line-height:.98;letter-spacing:-.082em}
                #ct-live-pain h2 span{color:var(--blue-2)}
                #ct-live-pain .ct-live-pain-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:64px}
                #ct-live-pain .ct-live-pain-card{min-height:190px;display:grid;place-items:center;padding:28px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(155deg,#171a21,#111319);text-align:center}
                #ct-live-pain .ct-live-pain-card b{font-size:clamp(30px,3vw,46px);line-height:1.05;letter-spacing:-.065em}
                @media(max-width:760px){
                  .ct-live-hero-actions{margin-top:24px}
                  .ct-live-hero-primary{width:min(100%,340px);min-height:56px;font-size:16px}
                  #ct-live-pain{padding:92px 0}
                  #ct-live-pain h2{font-size:46px}
                  #ct-live-pain .ct-live-pain-grid{grid-template-columns:1fr;gap:10px;margin-top:42px}
                  #ct-live-pain .ct-live-pain-card{min-height:108px;border-radius:18px}
                  #ct-live-pain .ct-live-pain-card b{font-size:30px}
                }
              `;
            };

            const makePain=()=>{
              const section=document.createElement('section');
              section.id='ct-live-pain';
              section.className='ad-section alt ct-live-pain';
              return section;
            };

            const fillPain=section=>{
              const wanted='<div class="wrap"><div class="ct-live-pain-head"><h2>기억으로 관리하면<br><span>놓칩니다.</span></h2></div><div class="ct-live-pain-grid"><div class="ct-live-pain-card"><b>누구였지?</b></div><div class="ct-live-pain-card"><b>언제 다시?</b></div><div class="ct-live-pain-card"><b>보냈나?</b></div></div></div>';
              if(section.innerHTML!==wanted)section.innerHTML=wanted;
            };

            const apply=()=>{
              queued=false;
              if(applying)return;
              applying=true;
              try{
                installStyle();
                const app=document.querySelector('#app');
                const heading=app?.querySelector('.hero-heading');
                const title=heading?.querySelector('h1');
                const description=heading?.querySelector(':scope > p:last-of-type');
                if(title&&title.innerHTML!==TITLE)title.innerHTML=TITLE;
                if(description&&description.textContent.trim()!==DESCRIPTION)description.textContent=DESCRIPTION;
                if(heading){
                  let actions=heading.querySelector('.ct-live-hero-actions');
                  if(!actions){actions=document.createElement('div');actions.className='ct-live-hero-actions';heading.append(actions);}
                  actions.innerHTML=`<a class="ct-live-hero-primary" href="${APP}" target="_blank" rel="noopener">7일 무료로 시작하기</a>`;
                }
                if(app){
                  let pain=document.getElementById('ct-live-pain');
                  if(!pain)pain=makePain();
                  fillPain(pain);
                  if(app.nextElementSibling!==pain)app.insertAdjacentElement('afterend',pain);
                }
              }finally{applying=false;}
            };

            const queueApply=()=>{if(queued||applying)return;queued=true;requestAnimationFrame(apply);};
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',apply,{once:true});else apply();
            [80,220,500,900,1500,2400,3600,5200].forEach(delay=>setTimeout(apply,delay));
            const observer=new MutationObserver(queueApply);
            observer.observe(document.documentElement,{subtree:true,childList:true,characterData:true});
            setTimeout(()=>observer.disconnect(),7000);
          })();
          EOF

      - name: Bust cache and shorten static hero copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<p>고객 · 상담 · 다음 할 일. 통화 직후 바로 남기세요.</p>','<p>고객 · 상담 · 다음 할 일.</p>',1)
          s=s.replace('/assets/calltag-landing-live-0102-v1.js?v=20260916-1','/assets/calltag-landing-live-0102-v1.js?v=20260916-2',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/fix-live-landing-0102-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/calltag-landing-live-0102-v1.js .github/workflows/fix-live-landing-0102-v2.yml
          git commit -m "fix(landing): match live visual tone and reduce copy"
          git push origin HEAD:main
