name: Verify free start CTA live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-free-start-cta-live.yml'

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Poll production
        shell: bash
        run: |
          set -euo pipefail
          URL='https://calltag.pagero.kr/guide/real-estate-customer-management/'
          for i in $(seq 1 24); do
            HTML="$(curl -fsSL --max-time 15 "$URL" || true)"
            if printf '%s' "$HTML" | grep -Fq '>무료로 시작</a>'               && printf '%s' "$HTML" | grep -Fq '부동산 고객관리, 무료로 시작'               && ! printf '%s' "$HTML" | grep -Fq '>7일 무료 시작</a>'; then
              echo "LIVE_OK attempt=$i"
              exit 0
            fi
            echo "waiting attempt=$i"
            sleep 10
          done
          echo "LIVE_NOT_UPDATED"
          exit 1
