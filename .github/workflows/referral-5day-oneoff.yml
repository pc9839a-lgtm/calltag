name: CallTag referral 5-day one-off patch

on:
  push:
    branches:
      - release/calltag-v04457-play-policy-external-final

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip-referral-5day]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/calltag-v04457-play-policy-external-final
          fetch-depth: 0

      - name: Standardize referral benefit to +5 days
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('app/src/main/java/kr/pagero/calltag/LoginActivity.java'): {
                  '추천인 코드 입력 시 무료 7일 추가': '추천인 코드 입력 시 무료 5일 추가',
              },
              Path('app/src/main/java/kr/pagero/calltag/BillingEntitlementActivity.java'): {
                  '신규 가입은 7일 무료이며 추천인 코드 입력 시 7일이 추가됩니다. 무료 이용이 끝나도 자동 결제되지 않습니다.':
                  '신규 가입은 7일 무료이며 추천인 코드 입력 시 5일이 추가됩니다. 무료 이용이 끝나도 자동 결제되지 않습니다.',
              },
              Path('app/src/main/java/kr/pagero/calltag/ReferralPartnerActivity.java'): {
                  '친구 혜택 · 회원가입할 때 추천인 코드를 입력하면 무료체험 +7일':
                  '친구 혜택 · 회원가입할 때 추천인 코드를 입력하면 무료체험 +5일',
                  '콜태그 가입할 때 아래 추천인 코드를 입력하면 무료체험이 7일 추가돼요.\\n':
                  '콜태그 가입할 때 아래 추천인 코드를 입력하면 무료체험이 5일 추가돼요.\\n',
              },
              Path('app/src/main/java/kr/pagero/calltag/MoreSettingsHubView.java'): {
                  '추천인 추천코드 친구 초대 무료체험 7일 추천 가입 5일':
                  '추천인 추천코드 친구 초대 무료체험 5일 추천 가입 5일',
              },
          }

          for path, mapping in replacements.items():
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in mapping.items():
                  if old not in text:
                      raise SystemExit(f'missing expected referral copy in {path}: {old}')
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f'no changes made to {path}')
              path.write_text(text, encoding='utf-8')

          # Shipped app must not describe a referral bonus as +7 days anymore.
          forbidden = [
              '추천인 코드 입력 시 무료 7일 추가',
              '추천인 코드 입력 시 7일이 추가됩니다',
              '추천인 코드를 입력하면 무료체험 +7일',
              '무료체험이 7일 추가돼요',
              '추천인 입력 시 +7일',
              '추천인 코드 입력 시 +7일',
          ]
          root = Path('app/src/main')
          leftovers = []
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.java', '.kt', '.xml'}:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              for token in forbidden:
                  if token in text:
                      leftovers.append(f'{path}: {token}')
          if leftovers:
              raise SystemExit('referral +7 copy still exists:\n' + '\n'.join(leftovers))
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git config user.name 'pc9839a-lgtm'
          git config user.email 'pc9839a@naver.com'
          git add app/src/main/java/kr/pagero/calltag/LoginActivity.java \
                  app/src/main/java/kr/pagero/calltag/BillingEntitlementActivity.java \
                  app/src/main/java/kr/pagero/calltag/ReferralPartnerActivity.java \
                  app/src/main/java/kr/pagero/calltag/MoreSettingsHubView.java
          git commit -m 'fix(referral): use +5 day benefit only [skip-referral-5day]'
          git push origin HEAD:release/calltag-v04457-play-policy-external-final
