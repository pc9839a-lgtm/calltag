name: CallTag 0.44.57 Play policy and external DB release

on:
  workflow_dispatch:
  push:
    branches:
      - release/calltag-v04457-play-policy-external-final
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CALLTAG_FIREBASE_APPLICATION_ID: ${{ secrets.CALLTAG_FIREBASE_APPLICATION_ID }}
      CALLTAG_FIREBASE_API_KEY: ${{ secrets.CALLTAG_FIREBASE_API_KEY }}
      CALLTAG_FIREBASE_PROJECT_ID: ${{ secrets.CALLTAG_FIREBASE_PROJECT_ID }}
      CALLTAG_FIREBASE_SENDER_ID: ${{ secrets.CALLTAG_FIREBASE_SENDER_ID }}
      SECRET_UPLOAD_KEYSTORE_BASE64: ${{ secrets.CALLTAG_UPLOAD_KEYSTORE_BASE64 }}
      SECRET_UPLOAD_STORE_PASSWORD: ${{ secrets.CALLTAG_UPLOAD_STORE_PASSWORD }}
      SECRET_UPLOAD_KEY_ALIAS: ${{ secrets.CALLTAG_UPLOAD_KEY_ALIAS }}
      SECRET_UPLOAD_KEY_PASSWORD: ${{ secrets.CALLTAG_UPLOAD_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/calltag-universal-lead-contract-check.py
          grep -F 'versionCode 2026091101' app/build.gradle
          grep -F "versionName '0.44.57'" app/build.gradle
          grep -F 'android.permission.READ_CALL_LOG' app/src/main/AndroidManifest.xml
          grep -F 'android.permission.SEND_SMS' app/src/main/AndroidManifest.xml
          grep -F 'android.permission.FOREGROUND_SERVICE_SPECIAL_USE' app/src/main/AndroidManifest.xml
          grep -F 'android:foregroundServiceType="specialUse"' app/src/main/AndroidManifest.xml
          grep -F 'User-enabled phone CRM and SMS automation' app/src/main/AndroidManifest.xml
          grep -F 'DirectApiIntegrationActivity' app/src/release/AndroidManifest.xml
          grep -F 'https://calltag.pagero.kr/privacy/' app/src/main/java/kr/pagero/calltag/AppInfoActivity.java
          grep -F 'https://calltag.pagero.kr/terms/' app/src/main/java/kr/pagero/calltag/AppInfoActivity.java
          test -s account-deletion/index.html
          test -s privacy/index.html
          test -s terms/index.html

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare established Play upload key
        shell: bash
        run: |
          set -euo pipefail
          for key in SECRET_UPLOAD_KEYSTORE_BASE64 SECRET_UPLOAD_STORE_PASSWORD SECRET_UPLOAD_KEY_ALIAS SECRET_UPLOAD_KEY_PASSWORD
          do
            test -n "${!key:-}" || { echo "::error::${key} is not configured"; exit 1; }
          done
          KEYSTORE="$RUNNER_TEMP/calltag-upload.jks"
          printf '%s' "$SECRET_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "::add-mask::$SECRET_UPLOAD_STORE_PASSWORD"
          echo "::add-mask::$SECRET_UPLOAD_KEY_PASSWORD"
          {
            echo "CALLTAG_UPLOAD_KEYSTORE_PATH=$KEYSTORE"
            echo "CALLTAG_UPLOAD_STORE_PASSWORD=$SECRET_UPLOAD_STORE_PASSWORD"
            echo "CALLTAG_UPLOAD_KEY_ALIAS=$SECRET_UPLOAD_KEY_ALIAS"
            echo "CALLTAG_UPLOAD_KEY_PASSWORD=$SECRET_UPLOAD_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          keytool -list -v -keystore "$KEYSTORE" -storepass "$SECRET_UPLOAD_STORE_PASSWORD" -alias "$SECRET_UPLOAD_KEY_ALIAS" \
            | grep -E 'Alias name:|Owner:|SHA1:|SHA256:' > "$RUNNER_TEMP/CALLTAG_UPLOAD_KEY_FINGERPRINTS.txt"
          if grep -qi 'Android Debug' "$RUNNER_TEMP/CALLTAG_UPLOAD_KEY_FINGERPRINTS.txt"; then
            echo '::error::Debug signing key detected'
            exit 1
          fi

      - name: Build signed release AAB
        run: gradle :app:bundleRelease --no-daemon --stacktrace

      - name: Verify signed AAB
        shell: bash
        run: |
          set -euo pipefail
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          jarsigner -verify -certs "$AAB"
          mkdir -p "$RUNNER_TEMP/calltag-v0.44.57"
          cp "$AAB" "$RUNNER_TEMP/calltag-v0.44.57/CallTag-v0.44.57-code2026091101.aab"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/calltag-v0.44.57/CallTag-v0.44.57-code2026091101-debug.apk"
          sha256sum "$AAB" > "$RUNNER_TEMP/calltag-v0.44.57/CALLTAG_V04457_AAB_SHA256.txt"
          cp "$RUNNER_TEMP/CALLTAG_UPLOAD_KEY_FINGERPRINTS.txt" "$RUNNER_TEMP/calltag-v0.44.57/"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: calltag-v0.44.57-play-release
          path: ${{ runner.temp }}/calltag-v0.44.57
          retention-days: 90
          if-no-files-found: error
