name: Verify PageRo CRM guide live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-pagero-crm-guide-live.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Poll production
        shell: bash
        run: |
          set -euo pipefail
          URL='https://calltag.pagero.kr/guide/pagero-inquiry-customer-management/'
          HUB='https://calltag.pagero.kr/guide/'
          for i in $(seq 1 24); do
            HTML="$(curl -fsSL --max-time 15 "$URL" || true)"
            HUBHTML="$(curl -fsSL --max-time 15 "$HUB" || true)"
            OK=1
            printf '%s' "$HTML" | grep -Fq '<title>랜딩페이지 CRM 연동: PageRo 문의폼부터 고객관리까지 | 콜태그</title>' || OK=0
            printf '%s' "$HTML" | grep -Fq 'PageRo + 콜태그는 문의 접수와 후속 상담을 이어주는 조합입니다' || OK=0
            printf '%s' "$HTML" | grep -Fq '콜태그 무료로 시작' || OK=0
            printf '%s' "$HTML" | grep -Fq 'href="https://calltag.pagero.kr/">무료로 시작</a>' || OK=0
            printf '%s' "$HUBHTML" | grep -Fq '랜딩페이지 CRM 연동, PageRo 문의폼부터 고객관리까지' || OK=0
            if [ "$OK" -eq 1 ]; then
              echo "LIVE_OK attempt=$i"
              exit 0
            fi
            echo "waiting attempt=$i"
            sleep 10
          done
          echo "LIVE_NOT_UPDATED"
          exit 1
