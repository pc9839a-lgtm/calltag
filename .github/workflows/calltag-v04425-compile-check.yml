name: CallTag 0.44.25 Compile Check

on:
  workflow_dispatch:
  push:
    branches:
      - agent/calltag-v04422-billing-live
    paths:
      - 'app/**'
      - '.github/workflows/calltag-v04425-compile-check.yml'

permissions:
  contents: read

jobs:
  debug-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile patched app
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Stage compile-check APK
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          OUT="$RUNNER_TEMP/calltag-v0.44.25-compile-check"
          mkdir -p "$OUT"
          cp "$APK" "$OUT/CallTag-v0.44.25-code2026081211-debug-COMPILE-CHECK.apk"
          sha256sum "$APK" > "$OUT/APK_SHA256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: calltag-v0.44.25-code2026081211-compile-check
          path: ${{ runner.temp }}/calltag-v0.44.25-compile-check
          retention-days: 7
          if-no-files-found: error
