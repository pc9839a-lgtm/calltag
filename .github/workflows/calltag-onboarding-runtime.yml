name: CallTag installed onboarding check
on:
  push:
    branches: [ci/calltag-onboarding-runtime-20261116]
permissions:
  actions: read
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: calltag-onboarding-play-test
          run-id: 43806625709
          github-token: ${{ github.token }}
          path: build-under-test
      - name: Verify exact uploaded APK
        run: |
          echo '1a60cb9c30fe3d1bc727d6f1b2ea2bf4af220f82a5d91bcb5c1f712c792a19f5  build-under-test/app-debug.apk' | sha256sum -c
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check first launch and permission screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: python3 scripts/check-calltag-onboarding-apk.py
      - name: Preserve screenshots and accessibility tree
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calltag-onboarding-screen-proof
          path: screen-proof
          if-no-files-found: ignore
