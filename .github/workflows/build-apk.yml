name: Build CallTag APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main
      - agent/calltag-foundation

concurrency:
  group: calltag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CALLTAG_FIREBASE_APPLICATION_ID: ${{ secrets.CALLTAG_FIREBASE_APPLICATION_ID }}
      CALLTAG_FIREBASE_API_KEY: ${{ secrets.CALLTAG_FIREBASE_API_KEY }}
      CALLTAG_FIREBASE_PROJECT_ID: ${{ secrets.CALLTAG_FIREBASE_PROJECT_ID }}
      CALLTAG_FIREBASE_SENDER_ID: ${{ secrets.CALLTAG_FIREBASE_SENDER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Firebase build secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in CALLTAG_FIREBASE_APPLICATION_ID CALLTAG_FIREBASE_API_KEY CALLTAG_FIREBASE_PROJECT_ID CALLTAG_FIREBASE_SENDER_ID
          do
            if [ -z "${!key:-}" ]; then
              echo "::error::${key} is not configured"
              missing=1
            else
              echo "${key}=configured"
            fi
          done
          exit "$missing"

      - name: Verify product regression contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          more = Path('app/src/main/java/kr/pagero/calltag/MoreSettingsHubView.java').read_text(encoding='utf-8')
          entitlement = Path('app/src/main/java/kr/pagero/calltag/FeatureEntitlementStore.java').read_text(encoding='utf-8')
          billing = Path('app/src/main/java/kr/pagero/calltag/BillingEntitlementActivity.java').read_text(encoding='utf-8')
          referral = Path('app/src/main/java/kr/pagero/calltag/ReferralPartnerActivity.java').read_text(encoding='utf-8')
          automation = Path('app/src/main/java/kr/pagero/calltag/MessageAutomationSettingsActivity.java').read_text(encoding='utf-8')
          template = Path('app/src/main/java/kr/pagero/calltag/MessageTemplateEditorActivity.java').read_text(encoding='utf-8')
          monitor = Path('app/src/main/java/kr/pagero/calltag/CallMonitorService.java').read_text(encoding='utf-8')
          launcher = Path('app/src/main/java/kr/pagero/calltag/PostCallActivityLauncher.java').read_text(encoding='utf-8')
          guard = Path('app/src/main/java/kr/pagero/calltag/PostCallDeliveryGuard.java').read_text(encoding='utf-8')
          pagero = Path('app/src/main/java/kr/pagero/calltag/PageroConnectionActivity.java').read_text(encoding='utf-8')
          manifest = Path('app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          gradle = Path('app/build.gradle').read_text(encoding='utf-8')

          checks = {
              'billing entry': 'BillingEntitlementActivity.class' in more,
              'referral entry': 'ReferralPartnerActivity.class' in more,
              'bundle price': 'BUNDLE_PRICE_KRW = 6000' in entitlement and '월 6,000원' in billing,
              'partner center excluded': '파트너센터 열기' not in referral,
              'automation template buttons': '템플릿 선택' in automation,
              'follow-up delay choices': all(v in automation for v in ('1일 후','3일 후','5일 후','7일 후','1~30일 사이')),
              'variable examples removed': 'supportedVariablesLabel' not in template and '변수 ·' not in template,
              'post-call delayed call log': 'registerContentObserver' in monitor and 'lookupImmediately' in monitor,
              'post-call visibility receipt': 'PostCallDeliveryGuard.schedule' in launcher,
              'post-call notification fallback': 'CallPopupNotificationManager.showPostCall' in guard,
              'pagero user copy': '새 문의 확인' in pagero and '지금 동기화' not in pagero,
              'secure sync activities registered': '.CallTagSyncStatusActivity' in manifest and '.CallTagSyncDevicesActivity' in manifest,
              'version 0.42.7': "versionName '0.42.7'" in gradle and 'versionCode 67' in gradle,
              'stable WorkManager dependency': "androidx.work:work-runtime:2.11.2" in gradle,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items(): print(f'{name}={"ok" if ok else "missing"}')
          if failed: raise SystemExit('Product regression contract failed: ' + ', '.join(failed))
          PY

      - name: Verify secure sync Android contract
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          prefs = Path('app/src/main/java/kr/pagero/calltag/CallTagSyncPreferenceStore.java').read_text(encoding='utf-8')
          device = Path('app/src/main/java/kr/pagero/calltag/CallTagSyncDeviceStore.java').read_text(encoding='utf-8')
          local = Path('app/src/main/java/kr/pagero/calltag/CallTagSyncLocalStore.java').read_text(encoding='utf-8')
          adapter = Path('app/src/main/java/kr/pagero/calltag/CallTagSyncDataAdapter.java').read_text(encoding='utf-8')
          api = Path('app/src/main/java/kr/pagero/calltag/CallTagSyncApiClient.java').read_text(encoding='utf-8')
          manager = Path('app/src/main/java/kr/pagero/calltag/CallTagSyncManager.java').read_text(encoding='utf-8')
          screen = Path('app/src/main/java/kr/pagero/calltag/CallTagSyncStatusActivity.java').read_text(encoding='utf-8')
          devices_screen = Path('app/src/main/java/kr/pagero/calltag/CallTagSyncDevicesActivity.java').read_text(encoding='utf-8')
          auth = Path('app/src/main/java/kr/pagero/calltag/AuthSessionStore.java').read_text(encoding='utf-8')
          app = Path('app/src/main/java/kr/pagero/calltag/CallTagApplication.java').read_text(encoding='utf-8')
          boot = Path('app/src/main/java/kr/pagero/calltag/BootReceiver.java').read_text(encoding='utf-8')
          scheduler = Path('app/src/main/java/kr/pagero/calltag/CallTagSyncWorkScheduler.java').read_text(encoding='utf-8')
          worker = Path('app/src/main/java/kr/pagero/calltag/CallTagSyncWorker.java').read_text(encoding='utf-8')
          more = Path('app/src/main/java/kr/pagero/calltag/MoreSettingsHubView.java').read_text(encoding='utf-8')

          status_index = manager.find('CallTagSyncApiClient.status')
          scan_index = manager.find('CallTagSyncDataAdapter.scanLocal')
          checks = {
              'opt-in defaults false': 'getBoolean(KEY_ENABLED, false)' in prefs,
              'device id uses secure random': 'SecureRandom' in device and 'AndroidKeyStore' in device and 'AES/GCM/NoPadding' in device,
              'device identity rotates after erase': 'String rotate(Context context)' in device and 'CallTagSyncDeviceStore.rotate(this)' in screen,
              'owner id is persisted': 'KEY_OWNER_ID' in auth and 'ownerId(Context context)' in auth,
              'account isolated local database': 'account_key TEXT NOT NULL' in local and 'owner:' in local,
              'outbox and cursor': 'pending INTEGER' in local and 'META_CURSOR' in local,
              'stable UUID mapping': 'UUID.randomUUID()' in local,
              'supported minimal data only': all(v in adapter for v in ('customer','interaction','task','stage')),
              'call recording excluded from payload': 'recording' not in adapter.lower(),
              'server readiness before payload scan': status_index >= 0 and scan_index > status_index,
              'bootstrap push pull': all(v in manager for v in ('bootstrap(', 'pushPending(', 'pullChanges(')),
              '100 item batch': 'PAGE_SIZE = 100' in manager,
              'secure headers': all(v in api for v in ('X-Inlet-Session','X-CallTag-Device','X-CallTag-App-Version')),
              'device management api': '/api/calltag-sync/devices' in api and 'REVOKE_CALLTAG_SYNC_DEVICE' in api,
              'server erase api': '/api/calltag-sync/erase' in api and 'DELETE_CALLTAG_SYNC_DATA' in api,
              'device management ui': '연결된 기기' in devices_screen and '이 기기 연결 해제' in devices_screen,
              'current device revoke is not offered': 'if (!current && active' in devices_screen,
              'erase is separate from disabling': '서버 복구본 삭제' in screen and '데이터 보호를 끄는 것과 서버 복구본 삭제는 다릅니다' in screen,
              'local customer data survives erase': 'entity_map' in screen and 'calltag.db' not in screen,
              'explicit consent copy': '통화 녹음과 전체 연락처는 전송하지 않습니다' in screen,
              'settings entry': '데이터 보호·복구' in more and 'CallTagSyncStatusActivity.class' in more,
              'periodic background work': 'PeriodicWorkRequest.Builder' in scheduler and 'PERIOD_MINUTES = 15L' in scheduler,
              'network and battery constraints': 'NetworkType.CONNECTED' in scheduler and 'setRequiresBatteryNotLow(true)' in scheduler,
              'unique account-scoped work': 'enqueueUniquePeriodicWork' in scheduler and 'enqueueUniqueWork' in scheduler and 'SHA-256' in scheduler,
              'worker remains opt-in gated': 'CallTagSyncPreferenceStore.isEnabled' in worker and 'AuthSessionStore.hasSession' in worker,
              'transient failures retry': 'Result.retry()' in worker and 'WAITING' in worker and 'ERROR' in worker,
              'maintenance blocks background work': 'isMaintenanceRunning()' in scheduler and 'isMaintenanceRunning()' in worker,
              'consent schedules and cancels work': 'CallTagSyncWorkScheduler.reconcile' in prefs and 'CallTagSyncWorkScheduler.cancel' in prefs,
              'login and logout reconcile work': 'CallTagSyncWorkScheduler.reconcile(context)' in auth and 'CallTagSyncWorkScheduler.cancel(context)' in auth,
              'boot and update restore work': 'CallTagSyncWorkScheduler.reconcile(app)' in boot and 'package_replaced' in boot,
              'app background queues final sync': 'app_background' in app and 'CallTagSyncWorkScheduler.enqueueImmediate' in app,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items(): print(f'{name}={"ok" if ok else "missing"}')
          if failed: raise SystemExit('Secure sync contract failed: ' + ', '.join(failed))
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify generated Firebase BuildConfig
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import re
          from pathlib import Path
          path = Path('app/build/generated/source/buildConfig/debug/kr/pagero/calltag/BuildConfig.java')
          if not path.exists(): raise SystemExit(f'BuildConfig not found: {path}')
          text = path.read_text(encoding='utf-8')
          for field in ('FIREBASE_APPLICATION_ID','FIREBASE_API_KEY','FIREBASE_PROJECT_ID','FIREBASE_SENDER_ID'):
              match = re.search(rf'{field}\s*=\s*"([^"]*)";', text)
              if not match or not match.group(1).strip(): raise SystemExit(f'{field} is empty')
              print(f'{field}=configured')
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calltag-v0.42.7-background-data-protection-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
