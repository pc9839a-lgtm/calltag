name: Build CallTag Play Internal

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read

concurrency:
  group: calltag-play-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CALLTAG_FIREBASE_APPLICATION_ID: ${{ secrets.CALLTAG_FIREBASE_APPLICATION_ID }}
      CALLTAG_FIREBASE_API_KEY: ${{ secrets.CALLTAG_FIREBASE_API_KEY }}
      CALLTAG_FIREBASE_PROJECT_ID: ${{ secrets.CALLTAG_FIREBASE_PROJECT_ID }}
      CALLTAG_FIREBASE_SENDER_ID: ${{ secrets.CALLTAG_FIREBASE_SENDER_ID }}
      SECRET_UPLOAD_KEYSTORE_BASE64: ${{ secrets.CALLTAG_UPLOAD_KEYSTORE_BASE64 }}
      SECRET_UPLOAD_STORE_PASSWORD: ${{ secrets.CALLTAG_UPLOAD_STORE_PASSWORD }}
      SECRET_UPLOAD_KEY_ALIAS: ${{ secrets.CALLTAG_UPLOAD_KEY_ALIAS }}
      SECRET_UPLOAD_KEY_PASSWORD: ${{ secrets.CALLTAG_UPLOAD_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify current Play release contract
        shell: bash
        run: |
          set -euo pipefail
          for key in CALLTAG_FIREBASE_APPLICATION_ID CALLTAG_FIREBASE_API_KEY CALLTAG_FIREBASE_PROJECT_ID CALLTAG_FIREBASE_SENDER_ID
          do
            test -n "${!key:-}" || { echo "::error::${key} is not configured"; exit 1; }
          done
          python3 <<'PY'
          import re
          from pathlib import Path

          app = Path('app/build.gradle').read_text(encoding='utf-8')
          root = Path('build.gradle').read_text(encoding='utf-8')
          manifest = Path('app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          billing = Path('app/src/main/java/kr/pagero/calltag/PlayBillingManager.java').read_text(encoding='utf-8')

          version_code = re.search(r'\bversionCode\s+(\d+)', app)
          version_name = re.search(r"\bversionName\s+'([^']+)'", app)
          if not version_code or not version_name:
              raise SystemExit('Android version could not be resolved')

          checks = {
              'package': "applicationId 'kr.pagero.calltag'" in app,
              'api36': 'compileSdk 36' in app and 'targetSdk 36' in app,
              'agp811': "version '8.11.1'" in root,
              'release signing': 'releaseSigningConfigured' in app and 'debuggable false' in app,
              'backup disabled': 'android:allowBackup="false"' in manifest,
              'billing 9.1.0': "com.android.billingclient:billing:9.1.0" in app,
              'server purchase verify': 'AuthApiClient.verifyGooglePurchase' in billing,
              'no arbitrary first offer': 'offers.get(0).getOfferToken()' not in billing,
              'explicit offer selector': 'selectPurchaseOffer(offers)' in billing,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(f'{name}={"ok" if ok else "missing"}')
          if failed:
              raise SystemExit('Play release contract failed: ' + ', '.join(failed))

          with open(Path(__import__('os').environ['GITHUB_ENV']), 'a', encoding='utf-8') as out:
              out.write(f'CALLTAG_VERSION_CODE={version_code.group(1)}\n')
              out.write(f'CALLTAG_VERSION_NAME={version_name.group(1)}\n')
          print(f'version={version_name.group(1)} code={version_code.group(1)}')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)"
          fi
          test -x "$SDKMANAGER" || { echo '::error::sdkmanager was not found'; exit 1; }
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Restore verified Play upload key
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_UPLOAD_KEY_ARTIFACT_ID: '8922836146'
          EXPECTED_UPLOAD_KEY_SHA256: 'C3:4C:98:88:9B:0C:88:8A:BB:39:94:6C:80:16:96:C2:89:E2:82:6C:10:0F:41:7A:0B:CE:25:A3:92:C4:72:A7'
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/calltag-upload.jks"
          configured=0
          for value in "$SECRET_UPLOAD_KEYSTORE_BASE64" "$SECRET_UPLOAD_STORE_PASSWORD" "$SECRET_UPLOAD_KEY_ALIAS" "$SECRET_UPLOAD_KEY_PASSWORD"; do
            [ -n "$value" ] && configured=$((configured + 1))
          done
          if [ "$configured" -ne 0 ] && [ "$configured" -ne 4 ]; then
            echo '::error::Configure all four upload-key Secrets or none.'
            exit 1
          fi

          if [ "$configured" -eq 4 ]; then
            printf '%s' "$SECRET_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            STORE_PASSWORD="$SECRET_UPLOAD_STORE_PASSWORD"
            KEY_ALIAS="$SECRET_UPLOAD_KEY_ALIAS"
            KEY_PASSWORD="$SECRET_UPLOAD_KEY_PASSWORD"
          else
            mkdir -p "$RUNNER_TEMP/original-upload-key"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ORIGINAL_UPLOAD_KEY_ARTIFACT_ID}/zip" > "$RUNNER_TEMP/original-upload-key.zip"
            unzip -q "$RUNNER_TEMP/original-upload-key.zip" -d "$RUNNER_TEMP/original-upload-key"
            cp "$RUNNER_TEMP/original-upload-key/calltag-upload.jks" "$KEYSTORE"
            CREDENTIALS="$RUNNER_TEMP/original-upload-key/CALLTAG_UPLOAD_KEY_CREDENTIALS.txt"
            STORE_PASSWORD="$(grep '^CALLTAG_UPLOAD_STORE_PASSWORD=' "$CREDENTIALS" | cut -d= -f2-)"
            KEY_ALIAS="$(grep '^CALLTAG_UPLOAD_KEY_ALIAS=' "$CREDENTIALS" | cut -d= -f2-)"
            KEY_PASSWORD="$(grep '^CALLTAG_UPLOAD_KEY_PASSWORD=' "$CREDENTIALS" | cut -d= -f2-)"
          fi

          test -s "$KEYSTORE"
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          chmod 600 "$KEYSTORE"
          keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" \
            | grep -E 'Alias name:|Owner:|SHA1:|SHA256:' > "$RUNNER_TEMP/CALLTAG_UPLOAD_KEY_FINGERPRINTS.txt"
          grep -F "SHA256: $EXPECTED_UPLOAD_KEY_SHA256" "$RUNNER_TEMP/CALLTAG_UPLOAD_KEY_FINGERPRINTS.txt"
          {
            echo "CALLTAG_UPLOAD_KEYSTORE_PATH=$KEYSTORE"
            echo "CALLTAG_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD"
            echo "CALLTAG_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "CALLTAG_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build debug APK and signed release AAB
        run: gradle :app:assembleDebug :app:bundleRelease --no-daemon --stacktrace

      - name: Verify and stage release files
        shell: bash
        run: |
          set -euo pipefail
          AAB='app/build/outputs/bundle/release/app-release.aab'
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$AAB"
          test -s "$APK"
          jarsigner -verify -certs "$AAB"
          if jarsigner -verify -verbose -certs "$AAB" | grep -qi 'Android Debug'; then
            echo '::error::Release AAB uses an Android debug certificate.'
            exit 1
          fi
          if unzip -l "$AAB" | grep -F 'calltag_launcher_safe.webp'; then
            echo '::error::Corrupted launcher bitmap leaked into release AAB.'
            exit 1
          fi
          OUT="$RUNNER_TEMP/calltag-v${CALLTAG_VERSION_NAME}-play"
          mkdir -p "$OUT"
          cp "$AAB" "$OUT/CallTag-v${CALLTAG_VERSION_NAME}-code${CALLTAG_VERSION_CODE}.aab"
          cp "$APK" "$OUT/CallTag-v${CALLTAG_VERSION_NAME}-code${CALLTAG_VERSION_CODE}-debug.apk"
          sha256sum "$AAB" > "$OUT/CALLTAG_AAB_SHA256.txt"
          cp "$RUNNER_TEMP/CALLTAG_UPLOAD_KEY_FINGERPRINTS.txt" "$OUT/"

      - name: Upload Google Play internal build
        uses: actions/upload-artifact@v4
        with:
          name: calltag-v${{ env.CALLTAG_VERSION_NAME }}-code${{ env.CALLTAG_VERSION_CODE }}-play-internal
          path: ${{ runner.temp }}/calltag-v${{ env.CALLTAG_VERSION_NAME }}-play
          retention-days: 90
          if-no-files-found: error
