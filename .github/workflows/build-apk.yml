name: Build CallTag Play Internal

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/**
      - docs/billing-referral-app-handoff-20260804
  pull_request:
    branches:
      - main
      - agent/calltag-foundation

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: calltag-play-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CALLTAG_FIREBASE_APPLICATION_ID: ${{ secrets.CALLTAG_FIREBASE_APPLICATION_ID }}
      CALLTAG_FIREBASE_API_KEY: ${{ secrets.CALLTAG_FIREBASE_API_KEY }}
      CALLTAG_FIREBASE_PROJECT_ID: ${{ secrets.CALLTAG_FIREBASE_PROJECT_ID }}
      CALLTAG_FIREBASE_SENDER_ID: ${{ secrets.CALLTAG_FIREBASE_SENDER_ID }}
      SECRET_UPLOAD_KEYSTORE_BASE64: ${{ secrets.CALLTAG_UPLOAD_KEYSTORE_BASE64 }}
      SECRET_UPLOAD_STORE_PASSWORD: ${{ secrets.CALLTAG_UPLOAD_STORE_PASSWORD }}
      SECRET_UPLOAD_KEY_ALIAS: ${{ secrets.CALLTAG_UPLOAD_KEY_ALIAS }}
      SECRET_UPLOAD_KEY_PASSWORD: ${{ secrets.CALLTAG_UPLOAD_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify Play release contract
        shell: bash
        run: |
          set -euo pipefail
          for key in CALLTAG_FIREBASE_APPLICATION_ID CALLTAG_FIREBASE_API_KEY CALLTAG_FIREBASE_PROJECT_ID CALLTAG_FIREBASE_SENDER_ID
          do
            test -n "${!key:-}" || { echo "::error::${key} is not configured"; exit 1; }
          done
          python3 <<'PY'
          from pathlib import Path
          app = Path('app/build.gradle').read_text(encoding='utf-8')
          root = Path('build.gradle').read_text(encoding='utf-8')
          manifest = Path('app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          checks = {
              'package': "applicationId 'kr.pagero.calltag'" in app,
              'version': 'versionCode 68' in app and "versionName '0.43.0'" in app,
              'api36': 'compileSdk 36' in app and 'targetSdk 36' in app,
              'agp811': "version '8.11.1'" in root,
              'release': 'debuggable false' in app and 'releaseSigningConfigured' in app,
              'workmanager': "androidx.work:work-runtime:2.11.2" in app,
              'sync screens': '.CallTagSyncStatusActivity' in manifest and '.CallTagSyncDevicesActivity' in manifest,
              'backup disabled': 'android:allowBackup="false"' in manifest,
              'release guide': Path('docs/V0430_PLAY_INTERNAL_RELEASE_KO.md').exists(),
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items(): print(f'{name}={"ok" if ok else "missing"}')
          if failed: raise SystemExit('Play release contract failed: ' + ', '.join(failed))
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)"
          fi
          test -x "$SDKMANAGER" || { echo '::error::sdkmanager was not found'; exit 1; }
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Prepare stable Play upload key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/calltag-upload.jks"
          BACKUP="$RUNNER_TEMP/calltag-upload-key-backup"
          mkdir -p "$BACKUP"

          configured=0
          for value in "$SECRET_UPLOAD_KEYSTORE_BASE64" "$SECRET_UPLOAD_STORE_PASSWORD" "$SECRET_UPLOAD_KEY_ALIAS" "$SECRET_UPLOAD_KEY_PASSWORD"
          do
            [ -n "$value" ] && configured=$((configured + 1))
          done
          if [ "$configured" -ne 0 ] && [ "$configured" -ne 4 ]; then
            echo '::error::Configure all four upload-key Secrets or none.'
            exit 1
          fi

          if [ "$configured" -eq 4 ]; then
            printf '%s' "$SECRET_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            STORE_PASSWORD="$SECRET_UPLOAD_STORE_PASSWORD"
            KEY_ALIAS="$SECRET_UPLOAD_KEY_ALIAS"
            KEY_PASSWORD="$SECRET_UPLOAD_KEY_PASSWORD"
            BOOTSTRAP=false
          else
            STORE_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
            KEY_PASSWORD="$STORE_PASSWORD"
            KEY_ALIAS=calltag-upload
            BOOTSTRAP=true
            keytool -genkeypair \
              -keystore "$KEYSTORE" \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 4096 \
              -validity 10000 \
              -dname 'CN=CallTag Upload, OU=Mobile, O=Pagero, L=Jeongeup, ST=Jeollabuk-do, C=KR'
            cp "$KEYSTORE" "$BACKUP/calltag-upload.jks"
            cat > "$BACKUP/CALLTAG_UPLOAD_KEY_CREDENTIALS.txt" <<EOF
CALLTAG_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD
CALLTAG_UPLOAD_KEY_ALIAS=$KEY_ALIAS
CALLTAG_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD

이 파일과 calltag-upload.jks를 반드시 오프라인으로 보관하세요.
첫 Google Play 업로드 이후 모든 후속 AAB는 동일 업로드 키로 서명해야 합니다.
EOF
          fi

          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          chmod 600 "$KEYSTORE"
          keytool -list -v \
            -keystore "$KEYSTORE" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            | grep -E 'Alias name:|Owner:|SHA1:|SHA256:' \
            > "$RUNNER_TEMP/CALLTAG_UPLOAD_KEY_FINGERPRINTS.txt"
          if grep -qi 'Android Debug' "$RUNNER_TEMP/CALLTAG_UPLOAD_KEY_FINGERPRINTS.txt"; then
            echo '::error::Android debug certificate cannot be used as the Play upload key.'
            exit 1
          fi
          if [ "$BOOTSTRAP" = true ]; then
            cp "$RUNNER_TEMP/CALLTAG_UPLOAD_KEY_FINGERPRINTS.txt" "$BACKUP/"
          fi

          {
            echo "CALLTAG_UPLOAD_KEYSTORE_PATH=$KEYSTORE"
            echo "CALLTAG_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD"
            echo "CALLTAG_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "CALLTAG_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
            echo "CALLTAG_BOOTSTRAP_UPLOAD_KEY=$BOOTSTRAP"
            echo "CALLTAG_UPLOAD_KEY_BACKUP_DIR=$BACKUP"
          } >> "$GITHUB_ENV"

      - name: Build debug APK and signed release AAB
        run: gradle :app:assembleDebug :app:bundleRelease --no-daemon --stacktrace

      - name: Verify and stage release files
        shell: bash
        run: |
          set -euo pipefail
          AAB='app/build/outputs/bundle/release/app-release.aab'
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$AAB" || { echo '::error::Release AAB was not created.'; exit 1; }
          test -s "$APK" || { echo '::error::Debug APK was not created.'; exit 1; }
          jarsigner -verify -certs "$AAB"
          if jarsigner -verify -verbose -certs "$AAB" | grep -qi 'Android Debug'; then
            echo '::error::Release AAB uses an Android debug certificate.'
            exit 1
          fi
          python3 <<'PY'
          import re
          from pathlib import Path
          for variant, debug in [('debug', 'true'), ('release', 'false')]:
              path = Path(f'app/build/generated/source/buildConfig/{variant}/kr/pagero/calltag/BuildConfig.java')
              text = path.read_text(encoding='utf-8')
              for field in ('FIREBASE_APPLICATION_ID','FIREBASE_API_KEY','FIREBASE_PROJECT_ID','FIREBASE_SENDER_ID'):
                  match = re.search(rf'{field}\s*=\s*"([^"]*)";', text)
                  if not match or not match.group(1).strip(): raise SystemExit(f'{field} is empty in {variant}')
              if not re.search(rf'DEBUG\s*=\s*{debug};', text): raise SystemExit(f'{variant} DEBUG flag is invalid')
          PY
          OUT="$RUNNER_TEMP/calltag-v0.43.0-play-internal"
          mkdir -p "$OUT"
          cp "$AAB" "$OUT/CallTag-v0.43.0-code68.aab"
          sha256sum "$AAB" > "$OUT/CALLTAG_V0430_AAB_SHA256.txt"
          cp "$RUNNER_TEMP/CALLTAG_UPLOAD_KEY_FINGERPRINTS.txt" "$OUT/"
          cp docs/V0430_PLAY_INTERNAL_RELEASE_KO.md "$OUT/UPLOAD_GUIDE_KO.md"

      - name: Upload Google Play internal AAB
        id: upload_aab
        uses: actions/upload-artifact@v4
        with:
          name: calltag-v0.43.0-play-internal-aab
          path: ${{ runner.temp }}/calltag-v0.43.0-play-internal
          retention-days: 90
          if-no-files-found: error

      - name: Upload upload-key backup
        id: upload_key
        if: env.CALLTAG_BOOTSTRAP_UPLOAD_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: calltag-v0.43.0-upload-key-backup-DOWNLOAD-AND-STORE
          path: ${{ env.CALLTAG_UPLOAD_KEY_BACKUP_DIR }}
          retention-days: 7
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: calltag-v0.43.0-api36-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Report build result to PR 40
        if: always() && github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          AAB_URL: ${{ steps.upload_aab.outputs.artifact-url }}
          KEY_URL: ${{ steps.upload_key.outputs.artifact-url }}
        shell: bash
        run: |
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$RESULT" = success ]; then
            {
              echo 'Play internal AAB build success.'
              echo
              echo "- run: $RUN_URL"
              echo "- AAB artifact: $AAB_URL"
              if [ -n "${KEY_URL:-}" ]; then
                echo "- upload-key backup: $KEY_URL"
                echo
                echo 'AAB와 upload-key backup은 반드시 같은 run의 파일을 사용하세요.'
              fi
            } > "$RUNNER_TEMP/play-result.md"
          else
            printf 'Play internal AAB build failed.\n\n- run: %s\n- head: %s\n' "$RUN_URL" "$GITHUB_SHA" > "$RUNNER_TEMP/play-result.md"
          fi
          gh pr comment 40 --body-file "$RUNNER_TEMP/play-result.md"
