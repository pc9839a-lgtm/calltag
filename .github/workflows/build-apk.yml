name: Build CallTag APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main
      - agent/calltag-foundation

concurrency:
  group: calltag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CALLTAG_FIREBASE_APPLICATION_ID: ${{ secrets.CALLTAG_FIREBASE_APPLICATION_ID }}
      CALLTAG_FIREBASE_API_KEY: ${{ secrets.CALLTAG_FIREBASE_API_KEY }}
      CALLTAG_FIREBASE_PROJECT_ID: ${{ secrets.CALLTAG_FIREBASE_PROJECT_ID }}
      CALLTAG_FIREBASE_SENDER_ID: ${{ secrets.CALLTAG_FIREBASE_SENDER_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify build contract
        shell: bash
        run: |
          set -euo pipefail
          for key in CALLTAG_FIREBASE_APPLICATION_ID CALLTAG_FIREBASE_API_KEY CALLTAG_FIREBASE_PROJECT_ID CALLTAG_FIREBASE_SENDER_ID
          do
            test -n "${!key:-}" || { echo "::error::${key} is not configured"; exit 1; }
          done
          python3 <<'PY'
          from pathlib import Path
          app = Path('app/build.gradle').read_text(encoding='utf-8')
          root = Path('build.gradle').read_text(encoding='utf-8')
          manifest = Path('app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          files = [
              'app/src/main/java/kr/pagero/calltag/CallTagSyncWorker.java',
              'app/src/main/java/kr/pagero/calltag/CallTagSyncWorkScheduler.java',
              'app/src/main/java/kr/pagero/calltag/CallTagSyncDevicesActivity.java',
          ]
          checks = {
              'package': "applicationId 'kr.pagero.calltag'" in app,
              'version': 'versionCode 68' in app and "versionName '0.43.0'" in app,
              'api36': 'compileSdk 36' in app and 'targetSdk 36' in app,
              'agp811': "version '8.11.1'" in root,
              'release signing': 'releaseSigningConfigured' in app,
              'workmanager': "androidx.work:work-runtime:2.11.2" in app,
              'sync screens': '.CallTagSyncStatusActivity' in manifest and '.CallTagSyncDevicesActivity' in manifest,
              'required files': all(Path(p).exists() for p in files),
          }
          missing = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items(): print(f'{name}={"ok" if ok else "missing"}')
          if missing: raise SystemExit('Build contract failed: ' + ', '.join(missing))
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)"
          fi
          test -x "$SDKMANAGER" || { echo '::error::sdkmanager was not found'; exit 1; }
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify generated Firebase BuildConfig
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import re
          from pathlib import Path
          path = Path('app/build/generated/source/buildConfig/debug/kr/pagero/calltag/BuildConfig.java')
          if not path.exists(): raise SystemExit(f'BuildConfig not found: {path}')
          text = path.read_text(encoding='utf-8')
          for field in ('FIREBASE_APPLICATION_ID','FIREBASE_API_KEY','FIREBASE_PROJECT_ID','FIREBASE_SENDER_ID'):
              match = re.search(rf'{field}\s*=\s*"([^"]*)";', text)
              if not match or not match.group(1).strip(): raise SystemExit(f'{field} is empty')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: calltag-v0.43.0-api36-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
