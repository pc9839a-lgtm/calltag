name: Build CallTag v0.43.2 Internal

on:
  workflow_dispatch:
  push:
    branches:
      - docs/billing-referral-app-handoff-20260804
  pull_request:
    branches:
      - agent/calltag-foundation

permissions:
  contents: read
  actions: read

concurrency:
  group: calltag-v0432-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CALLTAG_FIREBASE_APPLICATION_ID: ${{ secrets.CALLTAG_FIREBASE_APPLICATION_ID }}
      CALLTAG_FIREBASE_API_KEY: ${{ secrets.CALLTAG_FIREBASE_API_KEY }}
      CALLTAG_FIREBASE_PROJECT_ID: ${{ secrets.CALLTAG_FIREBASE_PROJECT_ID }}
      CALLTAG_FIREBASE_SENDER_ID: ${{ secrets.CALLTAG_FIREBASE_SENDER_ID }}
      SECRET_UPLOAD_KEYSTORE_BASE64: ${{ secrets.CALLTAG_UPLOAD_KEYSTORE_BASE64 }}
      SECRET_UPLOAD_STORE_PASSWORD: ${{ secrets.CALLTAG_UPLOAD_STORE_PASSWORD }}
      SECRET_UPLOAD_KEY_ALIAS: ${{ secrets.CALLTAG_UPLOAD_KEY_ALIAS }}
      SECRET_UPLOAD_KEY_PASSWORD: ${{ secrets.CALLTAG_UPLOAD_KEY_PASSWORD }}
      V0430_UPLOAD_KEY_ARTIFACT_ID: '8922836146'
      EXPECTED_UPLOAD_KEY_SHA256: 'C3:4C:98:88:9B:0C:88:8A:BB:39:94:6C:80:16:96:C2:89:E2:82:6C:10:0F:41:7A:0B:CE:25:A3:92:C4:72:A7'

    steps:
      - uses: actions/checkout@v4

      - name: Verify v0.43.2 direct MMS contracts
        shell: bash
        run: |
          set -euo pipefail
          for key in CALLTAG_FIREBASE_APPLICATION_ID CALLTAG_FIREBASE_API_KEY CALLTAG_FIREBASE_PROJECT_ID CALLTAG_FIREBASE_SENDER_ID
          do
            test -n "${!key:-}" || { echo "::error::${key} is not configured"; exit 1; }
          done
          python3 <<'PY'
          from pathlib import Path

          app = Path('app/build.gradle').read_text(encoding='utf-8')
          manifest = Path('app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          sender = Path('app/src/main/java/kr/pagero/calltag/DirectMmsSender.java').read_text(encoding='utf-8')
          status = Path('app/src/main/java/kr/pagero/calltag/MmsStatusReceiver.java').read_text(encoding='utf-8')
          sms = Path('app/src/main/java/kr/pagero/calltag/SmsSender.java').read_text(encoding='utf-8')
          scheduled = Path('app/src/main/java/kr/pagero/calltag/ScheduledMessageReceiver.java').read_text(encoding='utf-8')
          automation = Path('app/src/main/java/kr/pagero/calltag/MessageAutomationManager.java').read_text(encoding='utf-8')
          postcall = Path('app/src/main/java/kr/pagero/calltag/PostCallAutomationActivity.java').read_text(encoding='utf-8')
          followup = Path('app/src/main/java/kr/pagero/calltag/FollowUpAutomationManager.java').read_text(encoding='utf-8')
          followup_editor = Path('app/src/main/java/kr/pagero/calltag/FollowUpRuleEditorActivity.java').read_text(encoding='utf-8')
          provider = Path('app/src/main/java/kr/pagero/calltag/MmsPduProvider.java').read_text(encoding='utf-8')

          checks = {
              'version 0.43.2 code70': 'versionCode 70' in app and "versionName '0.43.2'" in app,
              'target api36': 'compileSdk 36' in app and 'targetSdk 36' in app,
              'klinker pdu dependency': 'com.klinkerapps:android-smsmms:5.2.6' in app,
              'direct MMS API': 'sendMultimediaMessage' in sender and 'Transaction.getBytes' in sender,
              'selected SIM': 'createForSubscriptionId' in sender or 'getSmsManagerForSubscriptionId' in sender,
              'PDU size guard': 'MAX_PDU_BYTES' in sender and 'MAX_IMAGE_BYTES' in sender,
              'PDU provider secure': 'Read only' in provider and 'getCanonicalPath' in provider,
              'manifest provider': '.MmsPduProvider' in manifest and '${applicationId}.mms-pdu' in manifest,
              'manifest result receiver': '.MmsStatusReceiver' in manifest,
              'template image snapshot': 'bindTemplateAttachment' in sms and 'MmsComposer.remember' in sms,
              'automatic MMS routing': 'DirectMmsSender.sendExisting' in sms,
              'scheduled MMS automatic': 'postComposeNotification' not in scheduled and 'SmsSender.sendExisting' in scheduled,
              'postcall image selection allowed': '이미지 없는 템플릿만' not in postcall and 'AutomationTemplateSelectionStore.set' in postcall,
              'postcall selected template used': 'AutomationTemplateSelectionStore.template' in automation,
              'followup image selection allowed': '이미지 없는 템플릿만' not in followup_editor,
              'followup image snapshot': 'bindTemplateAttachment' in followup,
              'MMS failure SMS fallback': 'fallbackToText' in status and 'SmsSender.sendExisting' in status,
              'release notes': Path('docs/V0432_DIRECT_MMS_AUTOMATION_KO.md').exists(),
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items(): print(f'{name}={"ok" if ok else "missing"}')
          if failed: raise SystemExit('v0.43.2 direct MMS contract failed: ' + ', '.join(failed))
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)"
          fi
          test -x "$SDKMANAGER" || { echo '::error::sdkmanager was not found'; exit 1; }
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Restore original Play upload key
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/calltag-upload.jks"
          configured=0
          for value in "$SECRET_UPLOAD_KEYSTORE_BASE64" "$SECRET_UPLOAD_STORE_PASSWORD" "$SECRET_UPLOAD_KEY_ALIAS" "$SECRET_UPLOAD_KEY_PASSWORD"
          do
            [ -n "$value" ] && configured=$((configured + 1))
          done
          if [ "$configured" -ne 0 ] && [ "$configured" -ne 4 ]; then
            echo '::error::Configure all four upload-key Secrets or none.'
            exit 1
          fi

          if [ "$configured" -eq 4 ]; then
            printf '%s' "$SECRET_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            STORE_PASSWORD="$SECRET_UPLOAD_STORE_PASSWORD"
            KEY_ALIAS="$SECRET_UPLOAD_KEY_ALIAS"
            KEY_PASSWORD="$SECRET_UPLOAD_KEY_PASSWORD"
          else
            mkdir -p "$RUNNER_TEMP/original-upload-key"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V0430_UPLOAD_KEY_ARTIFACT_ID}/zip" \
              > "$RUNNER_TEMP/original-upload-key.zip"
            unzip -q "$RUNNER_TEMP/original-upload-key.zip" -d "$RUNNER_TEMP/original-upload-key"
            cp "$RUNNER_TEMP/original-upload-key/calltag-upload.jks" "$KEYSTORE"
            CREDENTIALS="$RUNNER_TEMP/original-upload-key/CALLTAG_UPLOAD_KEY_CREDENTIALS.txt"
            STORE_PASSWORD="$(grep '^CALLTAG_UPLOAD_STORE_PASSWORD=' "$CREDENTIALS" | cut -d= -f2-)"
            KEY_ALIAS="$(grep '^CALLTAG_UPLOAD_KEY_ALIAS=' "$CREDENTIALS" | cut -d= -f2-)"
            KEY_PASSWORD="$(grep '^CALLTAG_UPLOAD_KEY_PASSWORD=' "$CREDENTIALS" | cut -d= -f2-)"
          fi

          test -s "$KEYSTORE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          chmod 600 "$KEYSTORE"
          keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" \
            | grep -E 'Alias name:|Owner:|SHA1:|SHA256:' > "$RUNNER_TEMP/upload-key-fingerprints.txt"
          grep -F "SHA256: $EXPECTED_UPLOAD_KEY_SHA256" "$RUNNER_TEMP/upload-key-fingerprints.txt"
          {
            echo "CALLTAG_UPLOAD_KEYSTORE_PATH=$KEYSTORE"
            echo "CALLTAG_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD"
            echo "CALLTAG_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "CALLTAG_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build debug APK and signed release AAB
        run: gradle :app:assembleDebug :app:bundleRelease --no-daemon --stacktrace

      - name: Verify and stage v0.43.2 files
        shell: bash
        run: |
          set -euo pipefail
          AAB='app/build/outputs/bundle/release/app-release.aab'
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$AAB"
          test -s "$APK"
          jarsigner -verify -certs "$AAB"
          if jarsigner -verify -verbose -certs "$AAB" | grep -qi 'Android Debug'; then
            echo '::error::Release AAB uses a debug certificate.'
            exit 1
          fi
          OUT="$RUNNER_TEMP/calltag-v0.43.2-internal"
          mkdir -p "$OUT"
          cp "$AAB" "$OUT/CallTag-v0.43.2-code70.aab"
          sha256sum "$AAB" > "$OUT/CALLTAG_V0432_AAB_SHA256.txt"
          cp "$RUNNER_TEMP/upload-key-fingerprints.txt" "$OUT/CALLTAG_UPLOAD_KEY_FINGERPRINTS.txt"
          cp docs/V0432_DIRECT_MMS_AUTOMATION_KO.md "$OUT/PATCH_NOTES_KO.md"

      - name: Upload Play internal AAB
        uses: actions/upload-artifact@v4
        with:
          name: calltag-v0.43.2-play-internal-aab
          path: ${{ runner.temp }}/calltag-v0.43.2-internal
          retention-days: 90
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: calltag-v0.43.2-api36-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
