name: Apply CallTag live section 04

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-section04-live-v1.yml

permissions:
  contents: write

jobs:
  apply-section04:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/apply_section04_live.py

      - name: Validate
        run: |
          node --check assets/calltag-landing-live-0102-v1.js
          grep -q 'ctLanding0104V1' assets/calltag-landing-live-0102-v1.js
          grep -q 'ct-live-integrations' assets/calltag-landing-live-0102-v1.js
          grep -q 'Meta Lead Ads' assets/calltag-landing-live-0102-v1.js
          grep -q 'Google Forms' assets/calltag-landing-live-0102-v1.js
          grep -q 'PageRo' assets/calltag-landing-live-0102-v1.js
          grep -q 'Webhook' assets/calltag-landing-live-0102-v1.js
          grep -q '20260916-7' index.html

      - name: Commit live patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/calltag-landing-live-0102-v1.js index.html
          git commit -m 'feat(landing): add section 04 external inquiry flow'
          git push origin HEAD:main

      - name: Remove one-shot files
        run: |
          git pull --rebase origin main
          git rm .github/workflows/apply-section04-live-v1.yml scripts/apply_section04_live.py
          git commit -m 'chore(ci): remove section 04 patch helpers'
          git push origin HEAD:main
