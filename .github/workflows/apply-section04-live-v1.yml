name: Apply CallTag live section 04

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-section04-live-v1.yml

permissions:
  contents: write

jobs:
  apply-section04:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: |
          sed -i 's/ctLanding0103V1/ctLanding0103V2/g' scripts/apply_section04_live.py
          python scripts/apply_section04_live.py

      - name: Validate
        run: |
          node --check assets/calltag-landing-live-0102-v1.js
          python - <<'PY'
          from pathlib import Path
          js=Path('assets/calltag-landing-live-0102-v1.js').read_text(encoding='utf-8')
          html=Path('index.html').read_text(encoding='utf-8')
          required=['ctLanding0104V1','ct-live-integrations','Meta Lead Ads','Google Forms','PageRo','Webhook']
          missing=[x for x in required if x not in js]
          assert not missing, f'missing in js: {missing}'
          assert '20260916-7' in html, 'cache version missing'
          print('section04 validation PASS')
          PY

      - name: Commit live patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/calltag-landing-live-0102-v1.js index.html
          git commit -m 'feat(landing): add section 04 external inquiry flow'
          git push origin HEAD:main

      - name: Remove one-shot files
        run: |
          git pull --rebase origin main
          git rm .github/workflows/apply-section04-live-v1.yml scripts/apply_section04_live.py
          git commit -m 'chore(ci): remove section 04 patch helpers'
          git push origin HEAD:main
