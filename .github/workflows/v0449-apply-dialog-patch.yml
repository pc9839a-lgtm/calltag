name: Apply CallTag 0.44.9 dialog patch

on:
  push:
    branches:
      - agent/calltag-v0449-dialog-small-screen

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/calltag-v0449-dialog-small-screen
          fetch-depth: 0
      - name: Apply targeted UI replacements
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, value):
              Path(path).write_text(value, encoding='utf-8')

          def replace(path, old, new, count=1):
              value = read(path)
              actual = value.count(old)
              if actual < count:
                  raise SystemExit(f'{path}: expected at least {count} occurrence(s), found {actual}: {old[:80]!r}')
              value = value.replace(old, new, count)
              write(path, value)

          main = 'app/src/main/java/kr/pagero/calltag/MainActivity.java'
          home = 'app/src/main/java/kr/pagero/calltag/HomeTaskEditorActivity.java'
          pending = 'app/src/main/java/kr/pagero/calltag/PendingCallSectionView.java'
          time = 'app/src/main/java/kr/pagero/calltag/TaskTimeChoiceDialog.java'
          styler = 'app/src/main/java/kr/pagero/calltag/CallTagDialogStyler.java'
          spinner = 'app/src/main/java/kr/pagero/calltag/CallTagSpinnerAdapter.java'
          gradle = 'app/build.gradle'
          workflow = '.github/workflows/calltag-hotfix-build.yml'

          replace(main, 'import android.app.DatePickerDialog;\n', '')
          replace(home, 'import android.app.DatePickerDialog;\n', '')

          replace(main, '''        new AlertDialog.Builder(this)
                .setTitle("통화 감지 권한")
                .setMessage("발신·수신·부재중 통화를 할 일과 연결하는 데 필요합니다.")
                .setNegativeButton("취소", null)
                .setPositiveButton("권한 허용", (dialog, which) -> requestPermissions(
                        missing.toArray(new String[0]), REQUEST_MONITOR_PERMISSIONS))
                .show();''', '''        AlertDialog dialog = new AlertDialog.Builder(this, R.style.Theme_CallTag_Dialog)
                .setTitle("통화 감지 권한")
                .setMessage("발신·수신·부재중 통화를 할 일과 연결하는 데 필요합니다.")
                .setNegativeButton("취소", null)
                .setPositiveButton("권한 허용", (value, which) -> requestPermissions(
                        missing.toArray(new String[0]), REQUEST_MONITOR_PERMISSIONS))
                .create();
        dialog.setOnShowListener(ignored -> CallTagDialogStyler.apply(dialog));
        dialog.show();''')

          replace(main, '''        new DatePickerDialog(this, (view, year, month, dayOfMonth) -> {
            Calendar changed = Calendar.getInstance();
            changed.set(year, month, dayOfMonth,
                    current.get(Calendar.HOUR_OF_DAY), current.get(Calendar.MINUTE), 0);
            changed.set(Calendar.MILLISECOND, 0);
            TaskTimeChoiceDialog.show(this,
                    current.get(Calendar.HOUR_OF_DAY), current.get(Calendar.MINUTE),
                    "이 시간으로 변경", (hourOfDay, minute) -> {
                changed.set(Calendar.HOUR_OF_DAY, hourOfDay);
                changed.set(Calendar.MINUTE, minute);
                db.updateTaskDue(task.id, changed.getTimeInMillis());
                selectedCalendarDate.setTimeInMillis(changed.getTimeInMillis());
                visibleCalendarMonth.setTimeInMillis(changed.getTimeInMillis());
                visibleCalendarMonth.set(Calendar.DAY_OF_MONTH, 1);
                clearTime(visibleCalendarMonth);
                long now = System.currentTimeMillis();
                db.insertInteraction(task.customerId, "SCHEDULE_CHANGE", now, now, 0L,
                        "SCHEDULED", task.title + " 일정 변경");
                Toast.makeText(this, "일정을 변경했습니다.", Toast.LENGTH_SHORT).show();
                refreshAll();
            });
        }, current.get(Calendar.YEAR), current.get(Calendar.MONTH), current.get(Calendar.DAY_OF_MONTH)).show();''', '''        TaskDateChoiceDialog.show(this, current, "이 날짜로 변경", (year, month, dayOfMonth) -> {
            Calendar changed = Calendar.getInstance();
            changed.set(year, month, dayOfMonth,
                    current.get(Calendar.HOUR_OF_DAY), current.get(Calendar.MINUTE), 0);
            changed.set(Calendar.MILLISECOND, 0);
            TaskTimeChoiceDialog.show(this,
                    current.get(Calendar.HOUR_OF_DAY), current.get(Calendar.MINUTE),
                    "이 시간으로 변경", (hourOfDay, minute) -> {
                changed.set(Calendar.HOUR_OF_DAY, hourOfDay);
                changed.set(Calendar.MINUTE, minute);
                db.updateTaskDue(task.id, changed.getTimeInMillis());
                selectedCalendarDate.setTimeInMillis(changed.getTimeInMillis());
                visibleCalendarMonth.setTimeInMillis(changed.getTimeInMillis());
                visibleCalendarMonth.set(Calendar.DAY_OF_MONTH, 1);
                clearTime(visibleCalendarMonth);
                long now = System.currentTimeMillis();
                db.insertInteraction(task.customerId, "SCHEDULE_CHANGE", now, now, 0L,
                        "SCHEDULED", task.title + " 일정 변경");
                Toast.makeText(this, "일정을 변경했습니다.", Toast.LENGTH_SHORT).show();
                refreshAll();
            });
        });''')

          replace(main, '''        new AlertDialog.Builder(this)
                .setTitle("할 일 삭제")
                .setMessage("‘" + task.title + "’ 일정을 삭제합니다.")
                .setNegativeButton("취소", null)
                .setPositiveButton("삭제", (dialog, which) -> {
                    db.deleteTask(task.id);
                    Toast.makeText(this, "삭제했습니다.", Toast.LENGTH_SHORT).show();
                    refreshAll();
                })
                .show();''', '''        AlertDialog dialog = new AlertDialog.Builder(this, R.style.Theme_CallTag_Dialog)
                .setTitle("할 일 삭제")
                .setMessage("‘" + task.title + "’ 일정을 삭제합니다.")
                .setNegativeButton("취소", null)
                .setPositiveButton("삭제", (value, which) -> {
                    db.deleteTask(task.id);
                    Toast.makeText(this, "삭제했습니다.", Toast.LENGTH_SHORT).show();
                    refreshAll();
                })
                .create();
        dialog.setOnShowListener(ignored -> CallTagDialogStyler.apply(dialog));
        dialog.show();''')

          replace(home, '''        Calendar selected = Calendar.getInstance();
        DatePickerDialog dialog = new DatePickerDialog(
                this,
                R.style.Theme_CallTag_PickerDialog,
                (view, year, month, dayOfMonth) -> {
                    selected.set(Calendar.YEAR, year);
                    selected.set(Calendar.MONTH, month);
                    selected.set(Calendar.DAY_OF_MONTH, dayOfMonth);
                    chooseTime(customer, type, selected);
                },
                selected.get(Calendar.YEAR),
                selected.get(Calendar.MONTH),
                selected.get(Calendar.DAY_OF_MONTH));
        dialog.setOnShowListener(ignored -> CallTagDialogStyler.apply(dialog));
        dialog.show();''', '''        Calendar selected = Calendar.getInstance();
        TaskDateChoiceDialog.show(this, selected, "이 날짜로 선택", (year, month, dayOfMonth) -> {
            selected.set(Calendar.YEAR, year);
            selected.set(Calendar.MONTH, month);
            selected.set(Calendar.DAY_OF_MONTH, dayOfMonth);
            chooseTime(customer, type, selected);
        });''')

          replace(pending, '''        new AlertDialog.Builder(getContext())
                .setTitle("확인할 통화 삭제")
                .setMessage("콜태그의 확인할 통화 목록에서만 삭제합니다. 휴대폰 기본 통화기록은 삭제하지 않습니다.")
                .setNegativeButton("취소", null)
                .setPositiveButton("삭제", (dialog, which) -> {
                    try (PendingCallStore store = new PendingCallStore(getContext())) {
                        if (store.deletePending(call.callLogId)) {
                            CrashTelemetryStore.record(getContext(), "pending_call", "deleted",
                                    String.valueOf(call.callLogId));
                            refresh();
                        } else {
                            Toast.makeText(getContext(), "이미 처리된 통화입니다.", Toast.LENGTH_SHORT).show();
                            refresh();
                        }
                    }
                })
                .show();''', '''        AlertDialog dialog = new AlertDialog.Builder(getContext(), R.style.Theme_CallTag_Dialog)
                .setTitle("확인할 통화 삭제")
                .setMessage("콜태그의 확인할 통화 목록에서만 삭제합니다. 휴대폰 기본 통화기록은 삭제하지 않습니다.")
                .setNegativeButton("취소", null)
                .setPositiveButton("삭제", (value, which) -> {
                    try (PendingCallStore store = new PendingCallStore(getContext())) {
                        if (store.deletePending(call.callLogId)) {
                            CrashTelemetryStore.record(getContext(), "pending_call", "deleted",
                                    String.valueOf(call.callLogId));
                            refresh();
                        } else {
                            Toast.makeText(getContext(), "이미 처리된 통화입니다.", Toast.LENGTH_SHORT).show();
                            refresh();
                        }
                    }
                })
                .create();
        dialog.setOnShowListener(ignored -> CallTagDialogStyler.apply(dialog));
        dialog.show();''')

          replace(time, 'import android.widget.LinearLayout;\nimport android.widget.TextView;\n',
                  'import android.widget.LinearLayout;\nimport android.widget.ScrollView;\nimport android.widget.TextView;\n')
          replace(time, '''        root.addView(summary, fixedTop(context, 58, 14));''', '''        summary.setMinHeight(dp(context, 58));
        summary.setPadding(dp(context, 8), dp(context, 10), dp(context, 8), dp(context, 10));
        root.addView(summary, top(context, 14));''')
          replace(time, '        root.addView(periodRow, fixedTop(context, 46, 7));',
                  '        root.addView(periodRow, top(context, 7));')
          replace(time, '''            LinearLayout.LayoutParams lineParams = new LinearLayout.LayoutParams(
                    LinearLayout.LayoutParams.MATCH_PARENT, dp(context, 42));''',
                  '            LinearLayout.LayoutParams lineParams = matchWrap();', 2)
          replace(time, '        root.addView(actions, fixedTop(context, 50, 18));',
                  '        root.addView(actions, top(context, 18));')
          replace(time, '''        AlertDialog dialog = new AlertDialog.Builder(context)
                .setView(root)
                .create();''', '''        ScrollView scroll = new ScrollView(context);
        scroll.setFillViewport(true);
        scroll.addView(root, matchWrap());

        AlertDialog dialog = new AlertDialog.Builder(context, R.style.Theme_CallTag_Dialog)
                .setView(scroll)
                .create();''')
          replace(time, '''        view.setBackgroundResource(R.drawable.bg_secondary_button);
        view.setClickable(true);''', '''        view.setBackgroundResource(R.drawable.bg_secondary_button);
        view.setMinHeight(dp(context, 44));
        view.setPadding(dp(context, 6), dp(context, 8), dp(context, 6), dp(context, 8));
        view.setClickable(true);''', 1)
          replace(time, '''        view.setBackgroundResource(primary
                ? R.drawable.bg_primary_button : R.drawable.bg_secondary_button);
        view.setClickable(true);''', '''        view.setBackgroundResource(primary
                ? R.drawable.bg_primary_button : R.drawable.bg_secondary_button);
        view.setMinHeight(dp(context, 46));
        view.setPadding(dp(context, 8), dp(context, 8), dp(context, 8), dp(context, 8));
        view.setClickable(true);''')
          replace(time, '''    private static LinearLayout.LayoutParams fixedTop(Context context, int height, int margin) {
        LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(
                LinearLayout.LayoutParams.MATCH_PARENT, dp(context, height));
        params.topMargin = dp(context, margin);
        return params;
    }

''', '')
          replace(time, '        return new LinearLayout.LayoutParams(0, dp(context, 46), weight);',
                  '        return new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, weight);')

          replace(styler, '''            int width = Math.min(displayWidth - dp(dialog, SIDE_MARGIN_DP), dp(dialog, MAX_WIDTH_DP));
            params.width = Math.max(dp(dialog, 280), width);
            params.dimAmount = 0.72f;''', '''            int availableWidth = Math.max(1, displayWidth - dp(dialog, SIDE_MARGIN_DP * 2));
            params.width = Math.min(availableWidth, dp(dialog, MAX_WIDTH_DP));
            params.dimAmount = 0.72f;''')
          replace(styler, '''            window.setAttributes(params);
            window.addFlags(WindowManager.LayoutParams.FLAG_DIM_BEHIND);
            window.setLayout(params.width, WindowManager.LayoutParams.WRAP_CONTENT);''', '''            window.setAttributes(params);
            window.addFlags(WindowManager.LayoutParams.FLAG_DIM_BEHIND);
            window.setSoftInputMode(WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE);
            window.setLayout(params.width, WindowManager.LayoutParams.WRAP_CONTENT);''')
          replace(styler, '''        button.setTextSize(14f);
        button.setBackgroundResource(primary''', '''        button.setTextSize(14f);
        button.setMinHeight(dp(button, 44));
        button.setPadding(dp(button, 12), dp(button, 6), dp(button, 12), dp(button, 6));
        button.setBackgroundResource(primary''')
          replace(styler, '''    private static int dp(AlertDialog dialog, int value) {
        return Math.round(value * dialog.getContext().getResources().getDisplayMetrics().density);
    }''', '''    private static int dp(AlertDialog dialog, int value) {
        return Math.round(value * dialog.getContext().getResources().getDisplayMetrics().density);
    }

    private static int dp(View view, int value) {
        return Math.round(value * view.getResources().getDisplayMetrics().density);
    }''')

          replace(spinner, '''        super(context, android.R.layout.simple_spinner_item, values);
        setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item);''',
                  '        super(context, 0, values);')

          replace(gradle, 'versionCode 86\n        versionName \'0.44.8\'',
                  'versionCode 87\n        versionName \'0.44.9\'')

          value = read(workflow)
          value = value.replace('CallTag 0.44.8 calendar time picker regression',
                                'CallTag 0.44.9 dialog and small-screen regression')
          value = value.replace('Verify 0.44.8 contracts', 'Verify 0.44.9 contracts')
          value = value.replace("grep -F 'versionCode 86' app/build.gradle", "grep -F 'versionCode 87' app/build.gradle")
          value = value.replace("grep -F \"versionName '0.44.8'\" app/build.gradle", "grep -F \"versionName '0.44.9'\" app/build.gradle")
          value = value.replace('calltag-v0.44.8-code86-debug-apk', 'calltag-v0.44.9-code87-debug-apk')
          value = value.replace('calltag-v0.44.8-code86-instrumentation-results', 'calltag-v0.44.9-code87-instrumentation-results')
          anchor = '''          grep -F 'public static void show(Context context, int initialHourOfDay, int initialMinute' app/src/main/java/kr/pagero/calltag/TaskTimeChoiceDialog.java
'''
          extra = '''          grep -F 'public static void show(Context context, int initialHourOfDay, int initialMinute' app/src/main/java/kr/pagero/calltag/TaskTimeChoiceDialog.java

          # Date/time dialogs are CallTag-native, scroll-safe and never OEM pickers.
          test -e app/src/main/java/kr/pagero/calltag/TaskDateChoiceDialog.java
          grep -F 'TaskDateChoiceDialog.show(this, selected' app/src/main/java/kr/pagero/calltag/HomeTaskEditorActivity.java
          grep -F 'TaskDateChoiceDialog.show(this, current' app/src/main/java/kr/pagero/calltag/MainActivity.java
          assert_absent 'DatePickerDialog' app/src/main/java
          grep -F 'ScrollView scroll = new ScrollView(context);' app/src/main/java/kr/pagero/calltag/TaskTimeChoiceDialog.java
          grep -F 'ScrollView scroll = new ScrollView(context);' app/src/main/java/kr/pagero/calltag/TaskDateChoiceDialog.java

          # Framework dialogs stay dark and fit narrow screens / keyboard resize.
          grep -F 'SIDE_MARGIN_DP * 2' app/src/main/java/kr/pagero/calltag/CallTagDialogStyler.java
          grep -F 'SOFT_INPUT_ADJUST_RESIZE' app/src/main/java/kr/pagero/calltag/CallTagDialogStyler.java
          grep -F 'new AlertDialog.Builder(this, R.style.Theme_CallTag_Dialog)' app/src/main/java/kr/pagero/calltag/MainActivity.java
          grep -F 'new AlertDialog.Builder(getContext(), R.style.Theme_CallTag_Dialog)' app/src/main/java/kr/pagero/calltag/PendingCallSectionView.java

          # Spinner rows are CallTag-native with no framework simple_spinner resources.
          grep -F 'super(context, 0, values);' app/src/main/java/kr/pagero/calltag/CallTagSpinnerAdapter.java
          assert_absent 'android.R.layout.simple_spinner_' app/src/main/java
'''
          if anchor not in value:
              raise SystemExit('workflow contract anchor missing')
          value = value.replace(anchor, extra, 1)

          verify_anchor = '      - name: Verify 0.44.9 contracts\n'
          audit = '''      - name: Inventory framework UI calls
        shell: bash
        run: |
          echo '=== AlertDialog builders ==='
          grep -R -n -F 'new AlertDialog.Builder' app/src/main/java || true
          echo '=== Picker references ==='
          grep -R -n -E 'DatePickerDialog|TimePickerDialog' app/src/main/java || true
          echo '=== Spinner references ==='
          grep -R -n -E 'simple_spinner_|new Spinner|Spinner<' app/src/main/java || true

      - name: Verify 0.44.9 contracts
'''
          if verify_anchor not in value:
              raise SystemExit('workflow verify anchor missing')
          value = value.replace(verify_anchor, audit, 1)
          write(workflow, value)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "calltag-patch-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/v0449-apply-dialog-patch.yml
          git add app .github/workflows/calltag-hotfix-build.yml
          git commit -m "Unify dialogs and harden small-screen UI for 0.44.9"
          git push origin HEAD:agent/calltag-v0449-dialog-small-screen
