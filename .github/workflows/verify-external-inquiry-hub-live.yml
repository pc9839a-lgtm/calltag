name: Verify external inquiry CRM hub live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-external-inquiry-hub-live.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Poll production
        shell: bash
        run: |
          set -euo pipefail
          URL='https://calltag.pagero.kr/guide/external-inquiry-integration/'
          HUB='https://calltag.pagero.kr/guide/'
          MAP='https://calltag.pagero.kr/sitemap.xml'
          for i in $(seq 1 24); do
            HTML="$(curl -fsSL --max-time 15 "$URL" || true)"
            HUBHTML="$(curl -fsSL --max-time 15 "$HUB" || true)"
            SITEMAP="$(curl -fsSL --max-time 15 "$MAP" || true)"
            OK=1
            printf '%s' "$HTML" | grep -Fq '<title>CRM 문의 연동 비교: Meta·Google Forms·PageRo·Webhook | 콜태그</title>' || OK=0
            printf '%s' "$HTML" | grep -Fq 'Meta·Google Forms·PageRo·Webhook, 한눈에 비교하면 이렇습니다' || OK=0
            printf '%s' "$HTML" | grep -Fq '/guide/meta-lead-ads-customer-management/' || OK=0
            printf '%s' "$HTML" | grep -Fq '/guide/google-forms-customer-management/' || OK=0
            printf '%s' "$HTML" | grep -Fq '/guide/pagero-inquiry-customer-management/' || OK=0
            printf '%s' "$HTML" | grep -Fq '/guide/webhook-customer-inquiry-integration/' || OK=0
            printf '%s' "$HTML" | grep -Fq '콜태그 무료로 시작' || OK=0
            printf '%s' "$HUBHTML" | grep -Fq 'CRM 문의 연동 비교, Meta·Google Forms·PageRo·Webhook' || OK=0
            printf '%s' "$SITEMAP" | grep -A1 -F '<loc>https://calltag.pagero.kr/guide/external-inquiry-integration/</loc>' | grep -Fq '<lastmod>2026-10-04</lastmod>' || OK=0
            if [ "$OK" -eq 1 ]; then
              echo "LIVE_OK attempt=$i"
              exit 0
            fi
            echo "waiting attempt=$i"
            sleep 10
          done
          echo "LIVE_NOT_UPDATED"
          exit 1
