name: CallTag Current Signed Release

on:
  workflow_dispatch:
  push:
    branches:
      - agent/calltag-v04422-billing-live
    paths:
      - 'app/**'
      - 'config/play-upload-key-sha256.txt'
      - '.github/workflows/calltag-v04425-entitlement-fix.yml'

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' app/build.gradle | head -n 1)"
          VERSION_NAME="$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+'([^']+)'.*/\1/p" app/build.gradle | head -n 1)"
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          echo "CALLTAG_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "CALLTAG_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Building CallTag v${VERSION_NAME} code ${VERSION_CODE}"

      - name: Verify release contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -F "applicationId 'kr.pagero.calltag'" app/build.gradle
          grep -F 'com.android.billingclient:billing:9.1.0' app/build.gradle

          BILLING='app/src/main/java/kr/pagero/calltag/PlayBillingManager.java'
          test -s "$BILLING"
          grep -F 'request.add(subscription(FeatureEntitlementStore.PLAN_PHONE));' "$BILLING"
          grep -F 'request.add(subscription(FeatureEntitlementStore.PLAN_MESSAGE));' "$BILLING"
          if grep -F 'request.add(subscription(FeatureEntitlementStore.PLAN_BUNDLE));' "$BILLING"; then
            echo 'all_monthly must not be queried in this release.' >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore accepted Play upload key from two GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.CALLTAG_UPLOAD_KEYSTORE_BASE64 }}
          CREDENTIALS_TEXT: ${{ secrets.CALLTAG_UPLOAD_CREDENTIALS }}
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_SHA256="$(tr -d '\r\n ' < config/play-upload-key-sha256.txt)"
          if [ -z "$EXPECTED_SHA256" ]; then
            echo 'Accepted Play upload-key fingerprint is empty.' >&2
            exit 1
          fi

          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$CREDENTIALS_TEXT" ]; then
            echo 'Configure CALLTAG_UPLOAD_KEYSTORE_BASE64 and CALLTAG_UPLOAD_CREDENTIALS.' >&2
            exit 1
          fi

          CREDENTIALS_CLEAN="$(printf '%s\n' "$CREDENTIALS_TEXT" | tr -d '\r')"
          STORE_PASSWORD="$(printf '%s\n' "$CREDENTIALS_CLEAN" | sed -n 's/^CALLTAG_UPLOAD_STORE_PASSWORD=//p' | tail -n 1)"
          CREDENTIAL_ALIAS="$(printf '%s\n' "$CREDENTIALS_CLEAN" | sed -n 's/^CALLTAG_UPLOAD_KEY_ALIAS=//p' | tail -n 1)"
          KEY_PASSWORD="$(printf '%s\n' "$CREDENTIALS_CLEAN" | sed -n 's/^CALLTAG_UPLOAD_KEY_PASSWORD=//p' | tail -n 1)"
          KEY_ALIAS='calltag-upload'

          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo 'CALLTAG_UPLOAD_CREDENTIALS is missing required password entries.' >&2
            exit 1
          fi
          if [ -n "$CREDENTIAL_ALIAS" ] && [ "$CREDENTIAL_ALIAS" != "$KEY_ALIAS" ]; then
            echo 'Credential alias is not calltag-upload.' >&2
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/calltag-upload.jks"
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"; then
            echo 'CALLTAG_UPLOAD_KEYSTORE_BASE64 is not valid Base64.' >&2
            exit 1
          fi
          test -s "$KEYSTORE"

          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          chmod 600 "$KEYSTORE"

          keytool -list -v \
            -keystore "$KEYSTORE" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            | grep -E 'Alias name:|Owner:|SHA1:|SHA256:' \
            > "$RUNNER_TEMP/upload-key-fingerprints.txt"

          if ! grep -F "SHA256: $EXPECTED_SHA256" "$RUNNER_TEMP/upload-key-fingerprints.txt"; then
            echo 'Configured JKS does not match the Play Console accepted upload-key fingerprint.' >&2
            exit 1
          fi

          {
            echo "CALLTAG_UPLOAD_KEYSTORE_PATH=$KEYSTORE"
            echo "CALLTAG_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD"
            echo "CALLTAG_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "CALLTAG_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
            echo "CALLTAG_EXPECTED_UPLOAD_KEY_SHA256=$EXPECTED_SHA256"
          } >> "$GITHUB_ENV"

      - name: Build signed release AAB and APK
        run: gradle :app:bundleRelease :app:assembleRelease --no-daemon --stacktrace

      - name: Verify final AAB and APK use accepted upload certificate
        shell: bash
        run: |
          set -euo pipefail

          AAB='app/build/outputs/bundle/release/app-release.aab'
          APK='app/build/outputs/apk/release/app-release.apk'
          test -s "$AAB"
          test -s "$APK"

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"

          APK_VERIFY="$RUNNER_TEMP/apk-signature.txt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$APK_VERIFY"
          EXPECTED_COMPACT="$(printf '%s' "$CALLTAG_EXPECTED_UPLOAD_KEY_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          ACTUAL_APK="$(grep -i 'certificate SHA-256 digest:' "$APK_VERIFY" | head -n 1 | sed 's/.*digest: //' | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [ "$ACTUAL_APK" != "$EXPECTED_COMPACT" ]; then
            echo 'Final release APK certificate does not match the accepted Play upload key.' >&2
            exit 1
          fi

          jarsigner -verify -certs "$AAB"
          keytool -printcert -jarfile "$AAB" > "$RUNNER_TEMP/aab-certificate.txt"
          if ! grep -F "SHA256: $CALLTAG_EXPECTED_UPLOAD_KEY_SHA256" "$RUNNER_TEMP/aab-certificate.txt"; then
            echo 'Final release AAB certificate does not match the accepted Play upload key.' >&2
            exit 1
          fi

          OUT="$RUNNER_TEMP/calltag-signed-release"
          mkdir -p "$OUT"
          cp "$AAB" "$OUT/CallTag-v${CALLTAG_VERSION_NAME}-code${CALLTAG_VERSION_CODE}.aab"
          cp "$APK" "$OUT/CallTag-v${CALLTAG_VERSION_NAME}-code${CALLTAG_VERSION_CODE}-release.apk"
          sha256sum "$AAB" > "$OUT/CALLTAG_AAB_SHA256.txt"
          sha256sum "$APK" > "$OUT/CALLTAG_APK_SHA256.txt"
          cp "$RUNNER_TEMP/upload-key-fingerprints.txt" "$OUT/CALLTAG_UPLOAD_KEY_FINGERPRINTS.txt"
          cp "$RUNNER_TEMP/aab-certificate.txt" "$OUT/CALLTAG_AAB_CERTIFICATE.txt"
          cp "$RUNNER_TEMP/apk-signature.txt" "$OUT/CALLTAG_APK_SIGNATURE.txt"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: calltag-current-signed-release
          path: ${{ runner.temp }}/calltag-signed-release
          retention-days: 90
          if-no-files-found: error
