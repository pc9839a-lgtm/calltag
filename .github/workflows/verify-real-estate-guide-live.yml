name: Verify real estate guide live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-real-estate-guide-live.yml'

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Poll production
        shell: bash
        run: |
          set -euo pipefail
          URL='https://calltag.pagero.kr/guide/real-estate-customer-management/'
          for i in $(seq 1 24); do
            HTML="$(curl -fsSL --max-time 15 "$URL" || true)"
            if printf '%s' "$HTML" | grep -Fq '공인중개사 고객관리,<br>매물관리와 고객관리는<br>같지 않습니다.' && printf '%s' "$HTML" | grep -Fq 'guide-sticky-cta'; then
              echo "LIVE_OK attempt=$i"
              exit 0
            fi
            echo "waiting attempt=$i"
            sleep 10
          done
          echo "LIVE_NOT_UPDATED"
          exit 1
