name: Bump CallTag live patch v4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-calltag-live-v4.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bump live asset version
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); old='calltag-landing-live-0102-v1.js?v=20260916-3'; new='calltag-landing-live-0102-v1.js?v=20260916-4'; assert old in s or new in s, 'live script reference not found'; p.write_text(s.replace(old,new,1),encoding='utf-8')"
          node --check assets/calltag-landing-live-0102-v1.js
          grep -q 'ctLanding0103V1' assets/calltag-landing-live-0102-v1.js
          grep -q '약 10초면' assets/calltag-landing-live-0102-v1.js

      - name: Commit deployment
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'chore(landing): bump section 03 live asset'
            git push origin HEAD:main
          fi

      - name: Remove one-shot workflow
        shell: bash
        run: |
          git pull --rebase origin main
          git rm .github/workflows/bump-calltag-live-v4.yml
          git commit -m 'chore(ci): remove section 03 deploy workflow'
          git push origin HEAD:main
