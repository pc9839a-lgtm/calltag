name: Verify CallTag Play Internal AAB

on:
  pull_request:
    branches:
      - agent/calltag-foundation

permissions:
  contents: read

concurrency:
  group: calltag-play-internal-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-play-aab:
    runs-on: ubuntu-latest
    env:
      CALLTAG_FIREBASE_APPLICATION_ID: ${{ secrets.CALLTAG_FIREBASE_APPLICATION_ID }}
      CALLTAG_FIREBASE_API_KEY: ${{ secrets.CALLTAG_FIREBASE_API_KEY }}
      CALLTAG_FIREBASE_PROJECT_ID: ${{ secrets.CALLTAG_FIREBASE_PROJECT_ID }}
      CALLTAG_FIREBASE_SENDER_ID: ${{ secrets.CALLTAG_FIREBASE_SENDER_ID }}
      SECRET_UPLOAD_KEYSTORE_BASE64: ${{ secrets.CALLTAG_UPLOAD_KEYSTORE_BASE64 }}
      SECRET_UPLOAD_STORE_PASSWORD: ${{ secrets.CALLTAG_UPLOAD_STORE_PASSWORD }}
      SECRET_UPLOAD_KEY_ALIAS: ${{ secrets.CALLTAG_UPLOAD_KEY_ALIAS }}
      SECRET_UPLOAD_KEY_PASSWORD: ${{ secrets.CALLTAG_UPLOAD_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)"
          fi
          test -x "$SDKMANAGER" || { echo '::error::sdkmanager was not found'; exit 1; }
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Prepare release configuration and upload key
        shell: bash
        run: |
          set -euo pipefail
          for key in CALLTAG_FIREBASE_APPLICATION_ID CALLTAG_FIREBASE_API_KEY CALLTAG_FIREBASE_PROJECT_ID CALLTAG_FIREBASE_SENDER_ID
          do
            test -n "${!key:-}" || { echo "::error::${key} is not configured"; exit 1; }
          done

          python3 <<'PY'
          from pathlib import Path
          app = Path('app/build.gradle').read_text(encoding='utf-8')
          root = Path('build.gradle').read_text(encoding='utf-8')
          required = {
              'package': "applicationId 'kr.pagero.calltag'" in app,
              'version': 'versionCode 68' in app and "versionName '0.43.0'" in app,
              'api36': 'compileSdk 36' in app and 'targetSdk 36' in app,
              'agp': "version '8.11.1'" in root,
              'release': 'debuggable false' in app and 'releaseSigningConfigured' in app,
          }
          missing = [k for k, v in required.items() if not v]
          if missing: raise SystemExit('Play contract failed: ' + ', '.join(missing))
          PY

          KEYSTORE="$RUNNER_TEMP/calltag-upload.jks"
          BACKUP="$RUNNER_TEMP/calltag-upload-key-backup"
          mkdir -p "$BACKUP"
          count=0
          for value in "$SECRET_UPLOAD_KEYSTORE_BASE64" "$SECRET_UPLOAD_STORE_PASSWORD" "$SECRET_UPLOAD_KEY_ALIAS" "$SECRET_UPLOAD_KEY_PASSWORD"
          do
            [ -n "$value" ] && count=$((count + 1))
          done
          if [ "$count" -ne 0 ] && [ "$count" -ne 4 ]; then
            echo '::error::Configure all four upload-key Secrets or none.'
            exit 1
          fi

          if [ "$count" -eq 4 ]; then
            printf '%s' "$SECRET_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            STORE_PASSWORD="$SECRET_UPLOAD_STORE_PASSWORD"
            KEY_ALIAS="$SECRET_UPLOAD_KEY_ALIAS"
            KEY_PASSWORD="$SECRET_UPLOAD_KEY_PASSWORD"
            BOOTSTRAP=false
          else
            STORE_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
            KEY_PASSWORD="$STORE_PASSWORD"
            KEY_ALIAS=calltag-upload
            BOOTSTRAP=true
            keytool -genkeypair -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" -alias "$KEY_ALIAS" -keyalg RSA -keysize 4096 \
              -validity 10000 -dname 'CN=CallTag Upload, OU=Mobile, O=Pagero, L=Jeongeup, ST=Jeollabuk-do, C=KR'
            cp "$KEYSTORE" "$BACKUP/calltag-upload.jks"
            cat > "$BACKUP/CALLTAG_UPLOAD_KEY_CREDENTIALS.txt" <<EOF
CALLTAG_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD
CALLTAG_UPLOAD_KEY_ALIAS=$KEY_ALIAS
CALLTAG_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD
EOF
          fi

          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          chmod 600 "$KEYSTORE"
          keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" \
            | grep -E 'Alias name:|Owner:|SHA1:|SHA256:' > "$RUNNER_TEMP/CALLTAG_UPLOAD_KEY_FINGERPRINTS.txt"
          if grep -qi 'Android Debug' "$RUNNER_TEMP/CALLTAG_UPLOAD_KEY_FINGERPRINTS.txt"; then
            echo '::error::Debug key is not allowed.'
            exit 1
          fi
          if [ "$BOOTSTRAP" = true ]; then cp "$RUNNER_TEMP/CALLTAG_UPLOAD_KEY_FINGERPRINTS.txt" "$BACKUP/"; fi
          {
            echo "CALLTAG_UPLOAD_KEYSTORE_PATH=$KEYSTORE"
            echo "CALLTAG_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD"
            echo "CALLTAG_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "CALLTAG_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
            echo "CALLTAG_BOOTSTRAP_UPLOAD_KEY=$BOOTSTRAP"
            echo "CALLTAG_UPLOAD_KEY_BACKUP_DIR=$BACKUP"
          } >> "$GITHUB_ENV"

      - name: Build signed release AAB
        run: gradle :app:bundleRelease --stacktrace

      - name: Verify and stage AAB
        shell: bash
        run: |
          set -euo pipefail
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          jarsigner -verify -strict -certs "$AAB"
          if jarsigner -verify -verbose -certs "$AAB" | grep -qi 'Android Debug'; then
            echo '::error::Release AAB uses a debug certificate.'
            exit 1
          fi
          OUT="$RUNNER_TEMP/calltag-v0.43.0-play-internal"
          mkdir -p "$OUT"
          cp "$AAB" "$OUT/CallTag-v0.43.0-code68.aab"
          sha256sum "$AAB" > "$OUT/CALLTAG_V0430_AAB_SHA256.txt"
          cp "$RUNNER_TEMP/CALLTAG_UPLOAD_KEY_FINGERPRINTS.txt" "$OUT/"
          cp docs/V0430_PLAY_INTERNAL_RELEASE_KO.md "$OUT/UPLOAD_GUIDE_KO.md"

      - uses: actions/upload-artifact@v4
        with:
          name: calltag-v0.43.0-play-internal-aab
          path: ${{ runner.temp }}/calltag-v0.43.0-play-internal
          retention-days: 90
          if-no-files-found: error

      - name: Upload first upload-key backup
        if: env.CALLTAG_BOOTSTRAP_UPLOAD_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: calltag-v0.43.0-upload-key-backup-DOWNLOAD-AND-STORE
          path: ${{ env.CALLTAG_UPLOAD_KEY_BACKUP_DIR }}
          retention-days: 7
          if-no-files-found: error
